<div class="max-w-g4 p-2 radius-surface bg-surface-popup shadow-overlay">
  <form class="flex flex-col gap-3" onsubmit="return false">
    <section class="flex flex-col gap-1" aria-labelledby="form-panel-who">
      <h3 id="form-panel-who" class="m-0 text-1 weight-6">Кому</h3>
      <sf-input name="email" label="Почта" input-type="email" default-value="anna@nord-wind.ru"></sf-input>
    </section>
    <hr class="sf-divider sf-divider-horizontal">
    <section class="flex flex-col gap-1" aria-labelledby="form-panel-role">
      <h3 id="form-panel-role" class="m-0 text-1 weight-6">Роль</h3>
      <fieldset class="border-0 p-0 m-0 flex flex-col gap-1/2">
        <legend class="p-0 m-bottom-1/2 text-1/2 color-on-surface-variant">Что можно делать</legend>
        <sf-radio name="form-panel-role" value="edit" label="Править" checked></sf-radio>
        <sf-radio name="form-panel-role" value="read" label="Только смотреть"></sf-radio>
      </fieldset>
    </section>
    <div class="flex flex-wrap gap-2">
      <sf-button native-type="submit" text="Пригласить"></sf-button>
      <sf-button native-type="reset" appearance="ghost" scheme="on-surface" text="Отмена"></sf-button>
    </div>
  </form>
</div>
