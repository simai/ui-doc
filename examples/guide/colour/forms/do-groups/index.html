<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-2">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — группы делят заголовок и воздух</span></figcaption>
      <div class="flex-1 p-2 flex flex-col gap-3">
        <section class="flex flex-col gap-1" aria-labelledby="groups-right-who">
          <h4 id="groups-right-who" class="m-0 text-1 weight-6">Получатель</h4>
          <sf-input name="groups-right-name" label="Имя" default-value="Анна Смирнова"></sf-input>
        </section>
        <section class="flex flex-col gap-1" aria-labelledby="groups-right-where">
          <h4 id="groups-right-where" class="m-0 text-1 weight-6">Адрес</h4>
          <sf-input name="groups-right-street" label="Улица, дом" default-value="ул. Ленина, 12"></sf-input>
        </section>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — рамка вокруг группы спорит с рамками полей</span></figcaption>
      <div class="flex-1 p-2 flex flex-col gap-3">
        <fieldset class="m-0 p-1 radius-1 border border-outline-variant flex flex-col gap-1">
          <legend class="p-x-1/4 text-1 weight-6">Получатель</legend>
          <sf-input name="groups-wrong-name" label="Имя" default-value="Анна Смирнова"></sf-input>
        </fieldset>
        <fieldset class="m-0 p-1 radius-1 border border-outline-variant flex flex-col gap-1">
          <legend class="p-x-1/4 text-1 weight-6">Адрес</legend>
          <sf-input name="groups-wrong-street" label="Улица, дом" default-value="ул. Ленина, 12"></sf-input>
        </fieldset>
      </div>
    </figure>
  </div>
</div>
