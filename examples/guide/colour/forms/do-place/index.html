<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-2">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — короткая форма прямо на странице</span></figcaption>
      <div class="flex-1 p-2 flex flex-col gap-3">
        <div class="flex flex-col gap-1">
          <sf-input name="place-right-mail" label="Почта" input-type="email" default-value="anna@nord-wind.ru"></sf-input>
          <sf-input name="place-right-pass" label="Пароль" input-type="password" default-value="nord-wind"></sf-input>
        </div>
        <div class="flex flex-wrap gap-1"><sf-button native-type="submit" text="Войти"></sf-button></div>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — та же форма в карточке: рамка ничего не отделяет</span></figcaption>
      <div class="flex-1 p-2">
        <div class="sf-card flex flex-col gap-3">
          <div class="flex flex-col gap-1">
            <sf-input name="place-wrong-mail" label="Почта" input-type="email" default-value="anna@nord-wind.ru"></sf-input>
            <sf-input name="place-wrong-pass" label="Пароль" input-type="password" default-value="nord-wind"></sf-input>
          </div>
          <div class="flex flex-wrap gap-1"><sf-button native-type="submit" text="Войти"></sf-button></div>
        </div>
      </div>
    </figure>
  </div>
</div>
