<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — поля с рамкой прямо на странице</span></figcaption>
      <div class="flex-1 p-2 flex flex-col gap-1">
        <sf-input name="right-city" label="Город" default-value="Казань"></sf-input>
        <sf-input name="right-street" label="Улица, дом" default-value="ул. Ленина, 12"></sf-input>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — залитые поля на серой области сливаются с ней</span></figcaption>
      <div class="flex-1 p-2 flex flex-col gap-1 bg-surface-area">
        <sf-input appearance="filled" name="wrong-city" label="Город" default-value="Казань"></sf-input>
        <sf-input appearance="filled" name="wrong-street" label="Улица, дом" default-value="ул. Ленина, 12"></sf-input>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — вопрос с вариантами в fieldset без рамки</span></figcaption>
      <div class="flex-1 p-2">
        <fieldset class="border-0 p-0 m-0 flex flex-col gap-1/2">
          <legend class="p-0 m-bottom-1/2 text-1/2 color-on-surface-variant">Доставка</legend>
          <sf-radio name="right-delivery" value="courier" label="Курьером" checked></sf-radio>
          <sf-radio name="right-delivery" value="pickup" label="Самовывоз"></sf-radio>
        </fieldset>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — рамка вокруг группы спорит с рамками полей</span></figcaption>
      <div class="flex-1 p-2">
        <fieldset class="m-0 p-1 radius-1 border border-outline-variant flex flex-col gap-1">
          <legend class="p-x-1/4 text-1/2 color-on-surface-variant">Получатель</legend>
          <sf-input name="wrong-surname" label="Фамилия" default-value="Смирнова"></sf-input>
          <sf-input name="wrong-phone" label="Телефон" default-value="+7 900 123-45-67"></sf-input>
        </fieldset>
      </div>
    </figure>
  </div>
</div>
