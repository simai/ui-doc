<div style="block-size: 20rem; border: var(--sf-px) solid var(--sf-outline-variant); border-radius: var(--sf-radius--ui); overflow: hidden;">
  <div class="sf-workspace" data-sf-workspace-view="main" data-sf-workspace-panel="open">
    <section class="sf-workspace-list p-2" aria-label="Разговоры">
      <p><a href="#" aria-current="true">Выпуск документации</a></p>
      <p><a href="#">Отпуск и перенос</a></p>
