<div class="query-container">
  <div class="grid grid-col-1 cq-sm:grid-col-2 gap-4">
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 flex-col gap-2 p-3 radius-surface border border-outline-variant">
        <div class="flex flex-wrap gap-2 items-cross-center">
          <sf-button text="Сохранить" icon-start="check"></sf-button>
          <sf-button appearance="outline" text="Отмена"></sf-button>
          <sf-button-icon icon="settings" aria-label="Настройки"></sf-button-icon>
        </div>
        <sf-input name="q-normal" placeholder="Поиск" icon-start="search"></sf-input>
        <div class="flex flex-wrap gap-2 items-cross-center">
          <sf-tag text="Новые"></sf-tag>
          <sf-badge text="12"></sf-badge>
          <sf-switch label="Только мои"></sf-switch>
        </div>
        <p class="m-0">Текст страницы рядом с контролами.</p>
      </div>
      <span class="text-1/2 color-on-surface-variant wrap-none">обычная</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 flex-col gap-2 p-3 radius-surface border border-outline-variant" data-sf-density="compact">
        <div class="flex flex-wrap gap-2 items-cross-center">
          <sf-button text="Сохранить" icon-start="check"></sf-button>
          <sf-button appearance="outline" text="Отмена"></sf-button>
          <sf-button-icon icon="settings" aria-label="Настройки"></sf-button-icon>
        </div>
        <sf-input name="q-compact" placeholder="Поиск" icon-start="search"></sf-input>
        <div class="flex flex-wrap gap-2 items-cross-center">
          <sf-tag text="Новые"></sf-tag>
          <sf-badge text="12"></sf-badge>
          <sf-switch label="Только мои"></sf-switch>
        </div>
        <p class="m-0">Текст страницы рядом с контролами.</p>
      </div>
      <span class="text-1/2 color-on-surface-variant wrap-none">compact</span>
    </div>
  </div>
</div>
