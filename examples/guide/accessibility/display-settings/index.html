<div class="grid grid-col-1 cq-md:grid-col-2 gap-4 query-container">
  <sf-display-settings layout="panel"></sf-display-settings>
  <main class="flex flex-col gap-2 min-w-0">
    <h2 class="text-3 m-0">Приём документов</h2>
    <p class="m-0">Документы принимают по будням с 9 до 18 часов. Заявление можно подать лично или через <a href="#reception-hours">личный кабинет</a>.</p>
    <p class="m-0" id="reception-hours">Справку выдают в течение трёх рабочих дней.</p>
    <div class="flex flex-wrap gap-1/3">
      <sf-button text="Записаться"></sf-button>
      <sf-button appearance="outline" text="Задать вопрос"></sf-button>
    </div>
    <p class="m-0 text-1/2 color-on-surface-variant" id="display-settings-state" role="status"></p>
  </main>
</div>
