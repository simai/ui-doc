<div class="flex flex-col gap-2">

    <sf-button data-device-width="320" appearance="outline" scheme="on-surface" size="1/2" text="320 px"></sf-button>
    <sf-button data-device-width="480" appearance="outline" scheme="on-surface" size="1/2" text="480 px"></sf-button>
    <sf-button data-device-width="720" appearance="outline" scheme="on-surface" size="1/2" text="720 px"></sf-button>

  <div id="device-place" class="query-container border-1 border-outline-variant radius-1 p-2 max-w-full">

  <p class="m-0">Указатель страницы: <strong id="device-pointer"></strong></p>
