<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> —  значок и текст строки через gap-1/2</span></figcaption>
      <div class="flex-1 p-2 flex flex-col">
        <div class="flex items-cross-center gap-1/2 p-y-1/3"><i class="sf-icon" aria-hidden="true">description</i><span>Договор поставки.pdf</span></div>
        <div class="flex items-cross-center gap-1/2 p-y-1/3"><i class="sf-icon" aria-hidden="true">image</i><span>Схема склада.png</span></div>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> —  промежуток между блоками (gap-2) внутри строки</span></figcaption>
      <div class="flex-1 p-2 flex flex-col">
        <div class="flex items-cross-center gap-2 p-y-1/3"><i class="sf-icon" aria-hidden="true">description</i><span>Договор поставки.pdf</span></div>
        <div class="flex items-cross-center gap-2 p-y-1/3"><i class="sf-icon" aria-hidden="true">image</i><span>Схема склада.png</span></div>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> —  кнопки одной группы через gap-1/3</span></figcaption>
      <div class="flex-1 p-2 flex flex-wrap items-cross-center gap-1/3"><sf-button text="Сохранить"></sf-button><sf-button appearance="outline" scheme="on-surface" text="Отмена"></sf-button></div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> —  кнопки одной группы через gap-2</span></figcaption>
      <div class="flex-1 p-2 flex flex-wrap items-cross-center gap-2"><sf-button text="Сохранить"></sf-button><sf-button appearance="outline" scheme="on-surface" text="Отмена"></sf-button></div>
    </figure>
  </div>
</div>
