<p>Настройка меняет шапку статьи. Текст статьи берётся из одного источника в обоих вариантах.</p>
<label for="recipe-mode">Вид шапки</label>
<select id="recipe-mode">
  <option value="compact">Краткая</option>
  <option value="expanded">Расширенная</option>
</select>
<p id="recipe-status" role="status"></p>
<div id="recipe-preview"></div>
<details><summary>Собранный Document</summary><pre id="recipe-document"></pre></details>
<details><summary>Полученный HTML</summary><pre id="recipe-html"></pre></details>
