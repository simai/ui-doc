<div class="flex flex-wrap gap-4">
  <div class="flex flex-col gap-1">
    <div class="sf-steps sf-steps--size-1 flex flex-col"><div class="sf-steps-container flex items-center" role="list" aria-label="Обычный этап"><div class="sf-step sf-step--size-1 sf-step--stage-default flex items-center justify-center" role="listitem"><span class="sf-step-container">Оплата<span class="sr-only">, не начато</span></span></div></div></div>
    <code class="text-1/2 color-on-surface-variant">sf-step--stage-default</code>
  </div>
  <div class="flex flex-col gap-1">
    <div class="sf-steps sf-steps--size-1 flex flex-col"><div class="sf-steps-container flex items-center" role="list" aria-label="Завершённый этап"><div class="sf-step sf-step--size-1 sf-step--stage-completed flex items-center justify-center" role="listitem"><i class="sf-icon" aria-hidden="true">check_circle</i><span class="sf-step-container">Корзина<span class="sr-only">, завершено</span></span></div></div></div>
    <code class="text-1/2 color-on-surface-variant">sf-step--stage-completed</code>
  </div>
  <div class="flex flex-col gap-1">
    <div class="sf-steps sf-steps--size-1 flex flex-col"><div class="sf-steps-container flex items-center" role="list" aria-label="Этап с ошибкой"><div class="sf-step sf-step--size-1 sf-step--stage-error flex items-center justify-center" role="listitem"><i class="sf-icon" aria-hidden="true">error</i><span class="sf-step-container">Проверка<span class="sr-only">, ошибка</span></span></div></div></div>
    <code class="text-1/2 color-on-surface-variant">sf-step--stage-error</code>
  </div>
</div>
