<div class="sf-steps sf-steps--marker-number sf-steps--layout-count">
  <div class="sf-steps-count">
    <p class="sf-steps-count-line"><span class="sf-steps-count-position">Шаг 2 из 4 ·</span> <span class="sf-steps-count-label sf-step--state-current">Доставка</span></p>
    <div class="sf-progress-bar sf-progress-bar--size-1/3" data-value="50" data-label="Оформление заказа"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
  </div>
  <ol class="sf-steps-container" role="list" aria-label="Оформление заказа">
    <li class="sf-step sf-step--state-done sf-step--passed" data-step-index="0"><span class="sf-step-body"><span class="sf-step-marker" aria-hidden="true"><i class="sf-icon">check</i></span><span class="sf-step-content"><span class="sf-step-container">Корзина</span><span class="sr-only">, пройден</span></span></span></li>
    <li class="sf-step sf-step--state-current" data-step-index="1" aria-current="step"><span class="sf-step-body"><span class="sf-step-marker" aria-hidden="true">2</span><span class="sf-step-content"><span class="sf-step-container">Доставка</span><span class="sr-only">, текущий</span></span></span></li>
    <li class="sf-step sf-step--state-ahead" data-step-index="2"><span class="sf-step-body"><span class="sf-step-marker" aria-hidden="true">3</span><span class="sf-step-content"><span class="sf-step-container">Оплата</span><span class="sr-only">, не начат</span></span></span></li>
    <li class="sf-step sf-step--state-ahead" data-step-index="3"><span class="sf-step-body"><span class="sf-step-marker" aria-hidden="true">4</span><span class="sf-step-content"><span class="sf-step-container">Подтверждение</span><span class="sr-only">, не начат</span></span></span></li>
  </ol>
</div>
