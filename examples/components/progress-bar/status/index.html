<div class="query-container">
  <div class="grid grid-col-1 gap-3">
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-label="Загрузка фотографий"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">без data-tone</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-tone="neutral" data-label="Занято места в архиве"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">data-tone="neutral"</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-tone="success" data-label="Проверка документов завершена"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">data-tone="success"</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-tone="warning" data-label="Место на диске почти занято"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">data-tone="warning"</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-tone="error" data-label="Импорт остановлен с ошибкой"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">data-tone="error"</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-progress-bar sf-progress-bar--size-1" data-value="70" data-position="none" data-tone="info" data-label="Обновление каталога"><div class="sf-progress-bar-main"><div class="sf-progress-bar-progress"></div></div></div>
      <span class="text-1/2 color-on-surface-variant">data-tone="info"</span>
    </div>
  </div>
</div>
