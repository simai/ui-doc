<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-3 gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex flex-1 items-cross-center gap-1/2">
        <span class="text-2 weight-medium">Лимит заказа</span>
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--plain sf-icon-button--size-1/2" aria-label="Что такое лимит заказа"><i class="sf-icon" aria-hidden="true">help</i></button>
      </div>
      <span class="text-1/2 color-on-surface-variant">подсказка у заголовка</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="flex flex-1 items-cross-center gap-1/2 p-x-2 p-y-1 radius-2 border border-outline-variant">
        <code id="icon-plain-code" class="flex-1 min-w-0">npm install @simai-studio/ui</code>
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--plain sf-icon-button--size-1" data-sf-copy-target="#icon-plain-code" aria-label="Копировать команду"><i class="sf-icon" aria-hidden="true">content_copy</i></button>
      </div>
      <span class="text-1/2 color-on-surface-variant">копирование в блоке кода</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="flex flex-1 items-cross-center gap-4">
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--plain sf-icon-button--size-1" aria-label="Перенос строк" aria-pressed="true"><i class="sf-icon sf-icon--filled" aria-hidden="true">wrap_text</i></button>
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--plain sf-icon-button--size-1" aria-label="Обновить" disabled><i class="sf-icon" aria-hidden="true">refresh</i></button>
      </div>
      <span class="text-1/2 color-on-surface-variant">нажатая и недоступная</span>
    </div>
  </div>
</div>
