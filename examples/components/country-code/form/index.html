<form class="grid gap-3">
  <label class="sf-country-code sf-country-code--size-1 flex flex-col" data-iso2="RU" data-locale="ru">
    <span class="sf-country-code-label flex"><span class="sf-country-code-text">Телефон</span><span class="sf-country-code-required" aria-hidden="true">*</span></span>
    <span class="sf-country-code-field flex items-center"><span class="sf-country-code-left flex items-center"><span class="sf-country-code-flag-icon"></span><i class="sf-icon" aria-hidden="true">expand_more</i></span><input type="tel" name="phone" value="+7 9991234567" required></span>
    <span class="sf-country-code-hint">Измените номер или страну, затем восстановите исходное значение.</span>
  </label>
  <div class="flex flex-wrap gap-2">
    <button class="sf-button sf-button--default sf-button--primary sf-button--size-1" type="submit"><span class="sf-button-text-container">Проверить значение</span></button>
    <button class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="reset"><span class="sf-button-text-container">Сбросить</span></button>
  </div>
  <output aria-live="polite"></output>
</form>
<script>
(() => {
  const form = document.currentScript.previousElementSibling;
  form.addEventListener('submit', event => {
    event.preventDefault();
    form.querySelector('output').value = String(new FormData(form).get('phone') || '');
  });
})();
</script>
