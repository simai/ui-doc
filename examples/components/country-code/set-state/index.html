<div class="flex flex-col gap-2 max-w-sm">
  <label class="sf-country-code sf-country-code--size-1 flex flex-col" data-locale="ru" data-use-mask="true" data-use-country-masks="true" data-show-code="true" data-multi-country="true" data-iso2="RU">
    <span class="sf-country-code-label flex"><span class="sf-country-code-text">Телефон</span></span>
    <span class="sf-country-code-field transition flex items-center"><span class="sf-country-code-left flex items-center"><span class="sf-country-code-flag-icon flex"></span><i class="sf-icon sf-country-code-caret" aria-hidden="true">arrow_drop_down</i></span><input type="tel" name="phone" value="+7 903 123-45-67"></span>
    <span class="sf-country-code-hint">Страну можно выбрать и из кода</span>
  </label>
  <div class="flex flex-wrap gap-2">
    <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1" data-iso2="DE"><span class="sf-button-text-container">Германия</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1" data-iso2="FR"><span class="sf-button-text-container">Франция</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1" data-iso2="RU"><span class="sf-button-text-container">Россия</span></button>
  </div>
  <p class="m-0 color-on-surface-variant" id="country-code-state" role="status">Значение: +7 903 123-45-67</p>
</div>
