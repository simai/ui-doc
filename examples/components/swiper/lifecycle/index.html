<section class="flex flex-col gap-2" data-swiper-demo="lifecycle">
  <div class="flex flex-wrap gap-1">
    <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1/2" data-swiper-add><span class="sf-button-text-container">Добавить слайд</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-swiper-remove><span class="sf-button-text-container">Удалить последний</span></button>
  </div>
  <div class="swiper" role="region" aria-label="Изменяемая подборка" tabindex="0">
    <div class="swiper-wrapper">
      <div class="swiper-slide p-x-1"><div class="bg-surface-container color-on-surface p-3 radius-3">Слайд 1</div></div>
      <div class="swiper-slide p-x-1"><div class="bg-surface-container color-on-surface p-3 radius-3">Слайд 2</div></div>
    </div>
  </div>
  <div class="flex gap-1">
    <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--outline sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Предыдущий слайд" data-swiper-prev><i class="sf-icon" aria-hidden="true">chevron_left</i></button>
    <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--outline sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Следующий слайд" data-swiper-next><i class="sf-icon" aria-hidden="true">chevron_right</i></button>
  </div>
</section>
