<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-3 gap-4">
    <div class="flex flex-col gap-2">
      <div class="sf-placeholder sf-placeholder--column">
        <span class="sf-placeholder__visual sf-featured-icon sf-featured-icon--soft sf-featured-icon--neutral sf-featured-icon--size-2" aria-hidden="true"><i class="sf-icon">group_add</i></span>
        <div class="sf-placeholder__content">
          <div class="sf-placeholder__header">
            <h3 class="sf-placeholder__title m-0">Сотрудников пока нет</h3>
            <p class="sf-placeholder__description m-0">Добавьте первого сотрудника, чтобы выдать ему доступ.</p>
          </div>
          <div class="sf-placeholder__actions">
            <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1/2">
              <span class="sf-button-text-container">Добавить сотрудника</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-placeholder sf-placeholder--column">
        <span class="sf-placeholder__visual sf-featured-icon sf-featured-icon--soft sf-featured-icon--neutral sf-featured-icon--size-2" aria-hidden="true"><i class="sf-icon">search_off</i></span>
        <div class="sf-placeholder__content">
          <div class="sf-placeholder__header">
            <h3 class="sf-placeholder__title m-0">Ничего не найдено</h3>
            <p class="sf-placeholder__description m-0">По запросу «Петров» сотрудников нет. Проверьте написание.</p>
          </div>
          <div class="sf-placeholder__actions">
            <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2">
              <span class="sf-button-text-container">Сбросить поиск</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-placeholder sf-placeholder--column">
        <span class="sf-placeholder__visual sf-featured-icon sf-featured-icon--soft sf-featured-icon--error sf-featured-icon--size-2" aria-hidden="true"><i class="sf-icon">cloud_off</i></span>
        <div class="sf-placeholder__content">
          <div class="sf-placeholder__header">
            <h3 class="sf-placeholder__title m-0">Список не загрузился</h3>
            <p class="sf-placeholder__description m-0">Нет связи с сервером. Данные не потеряны.</p>
          </div>
          <div class="sf-placeholder__actions">
            <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2">
              <span class="sf-button-text-container">Повторить</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
