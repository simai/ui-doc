<div class="flex flex-col gap-2 items-cross-start" data-solution-theme="settings">
  <section class="theme-light bg-surface-page color-on-surface p-2 radius-ui border border-outline flex flex-col gap-2 items-cross-start" data-theme-card>
    <div class="flex flex-wrap gap-1" role="group" aria-label="Выбор темы">
      <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="system" aria-pressed="false"><i class="sf-icon" aria-hidden="true">contrast</i><span class="sf-button-text-container">Как в системе</span></button>
      <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="light" aria-pressed="false"><i class="sf-icon" aria-hidden="true">light_mode</i><span class="sf-button-text-container">Светлая</span></button>
      <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="dark" aria-pressed="false"><i class="sf-icon" aria-hidden="true">dark_mode</i><span class="sf-button-text-container">Тёмная</span></button>
    </div>
    <p class="m-0">Карточка показывает выбранную тему.</p>
    <sf-button size="1/2" text="Кнопка"></sf-button>
  </section>
  <p class="m-0 text-1/2 color-on-surface-variant" role="status" data-theme-result></p>
</div>
