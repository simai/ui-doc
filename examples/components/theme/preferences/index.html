<div class="flex flex-col items-cross-start gap-3">
  <sf-segmented theme-switch aria-label="Тема"></sf-segmented>
  <div class="flex flex-wrap gap-1/3" role="radiogroup" aria-label="Выбор темы">
    <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="system"><span class="sf-button-text-container">Системная</span></button>
    <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="light"><span class="sf-button-text-container">Светлая</span></button>
    <button class="sf-theme-button sf-button sf-button--outline sf-button--on-surface sf-button--size-1" type="button" data-theme="dark"><span class="sf-button-text-container">Тёмная</span></button>
  </div>
</div>
