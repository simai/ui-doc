<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-4 items-end">
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-1/3" aria-label="Уведомления"><i class="sf-icon" aria-hidden="true">notifications</i><span class="sf-badge sf-badge--anchored" data-count="3"></span></button>
      <code class="text-1/2 color-on-surface-variant">size-1/3</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-1/2" aria-label="Уведомления"><i class="sf-icon" aria-hidden="true">notifications</i><span class="sf-badge sf-badge--anchored" data-count="3"></span></button>
      <code class="text-1/2 color-on-surface-variant">size-1/2</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-1" aria-label="Уведомления"><i class="sf-icon" aria-hidden="true">notifications</i><span class="sf-badge sf-badge--anchored" data-count="3"></span></button>
      <code class="text-1/2 color-on-surface-variant">size-1</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-2" aria-label="Уведомления"><i class="sf-icon" aria-hidden="true">notifications</i><span class="sf-badge sf-badge--anchored" data-count="3"></span></button>
      <code class="text-1/2 color-on-surface-variant">size-2</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-3" aria-label="Уведомления"><i class="sf-icon" aria-hidden="true">notifications</i><span class="sf-badge sf-badge--anchored" data-count="3"></span></button>
      <code class="text-1/2 color-on-surface-variant">size-3</code>
    </div>
  </div>
  <div class="flex flex-wrap gap-4 items-end">
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-2" aria-label="Сообщения"><i class="sf-icon" aria-hidden="true">mail</i><span class="sf-badge sf-badge--anchored" data-count="120"></span></button>
      <code class="text-1/2 color-on-surface-variant">data-count="120"</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--outline sf-icon-button--on-surface sf-icon-button--size-2" aria-label="Обновления"><i class="sf-icon" aria-hidden="true">update</i><span class="sf-badge sf-badge--anchored" data-dot></span></button>
      <code class="text-1/2 color-on-surface-variant">data-dot</code>
    </div>
    <div class="flex flex-col gap-1 items-center">
      <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--tonal sf-icon-button--primary sf-icon-button--size-2" aria-label="Заявки"><i class="sf-icon" aria-hidden="true">assignment</i><span class="sf-badge sf-badge--anchored" data-count="12" data-cap="9" data-label="{count} заявка|{count} заявки|{count} заявок"></span></button>
      <code class="text-1/2 color-on-surface-variant">data-cap="9", data-label</code>
    </div>
  </div>
</div>
