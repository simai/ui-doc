<div class="flex flex-wrap gap-4">
  <div class="flex flex-col gap-1">
    <label class="sf-radio-button sf-radio-button--size-1 flex"><span class="sf-radio-button-box transition flex items-cross-center content-main-center"><input name="t" type="radio" checked><span class="sf-radio-button-mark" aria-hidden="true"></span></span><span class="sf-radio-button-container flex flex-col"><span class="sf-radio-button-top flex"><span class="sf-radio-button-text">Обычная радиокнопка</span></span></span></label>
    <code class="text-1/2 color-on-surface-variant">без модификатора</code>
  </div>
  <div class="flex flex-col gap-1">
    <fieldset class="border-0 p-0 m-0">
      <legend class="m-bottom-2">Начертание заголовка</legend>
      <div class="sf-radio-button sf-radio-wrap--type-font flex sf-radio-button--size-1" data-sf-radio-descriptions='["Обычное начертание","Среднее начертание","Полужирное начертание"]'>
        <div class="sf-radio-group sf-radio-group--font flex items-cross-start">
          <label class="sf-radio-button sf-radio-button--size-1 sf-radio-button--type-font"><i class="sf-radio-text active" aria-hidden="true">Aa</i><input type="radio" name="font-weight" value="regular" class="sr-only" data-sf-radio-font-index="0" aria-label="Обычное начертание" checked></label>
          <label class="sf-radio-button sf-radio-button--size-1 sf-radio-button--type-font"><i class="sf-radio-text" aria-hidden="true">Aa</i><input type="radio" name="font-weight" value="medium" class="sr-only" data-sf-radio-font-index="1" aria-label="Среднее начертание"></label>
          <label class="sf-radio-button sf-radio-button--size-1 sf-radio-button--type-font"><i class="sf-radio-text" aria-hidden="true">Aa</i><input type="radio" name="font-weight" value="bold" class="sr-only" data-sf-radio-font-index="2" aria-label="Полужирное начертание"></label>
        </div>
        <div class="sf-radio-button-container flex flex-col"><span class="sf-radio-button-description">Обычное начертание</span></div>
      </div>
    </fieldset>
    <code class="text-1/2 color-on-surface-variant">sf-radio-wrap--type-font + sf-radio-button--type-font</code>
  </div>
</div>
