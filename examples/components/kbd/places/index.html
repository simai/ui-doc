<div class="query-container">
  <div class="grid grid-col-1 cq-sm:grid-col-2 gap-4">
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 flex-col items-cross-center content-main-center gap-2">
        <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" aria-keyshortcuts="Control+K"><i class="sf-icon" aria-hidden="true">search</i><span class="sf-button-text-container">Поиск</span><span class="sf-button-shortcut" aria-hidden="true"><kbd class="sf-kbd--group"><kbd>Ctrl</kbd><span class="sf-kbd-join">+</span><kbd class="sf-kbd--square">K</kbd></kbd></span></button>
      </div>
      <span class="text-1/2 color-on-surface-variant">в кнопке: sf-button-shortcut</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 flex-col items-cross-center content-main-center gap-2">
        <div class="sf-context-menu flex">
          <div class="relative">
            <div class="sf-context-menu-content flex flex-col flex-1" role="menu" aria-label="Правка">
              <button type="button" role="menuitem" class="sf-button sf-button--ghost sf-button--on-surface sf-button--size-1/2" aria-keyshortcuts="Control+C"><span class="sf-button-text-container">Копировать</span><span class="sf-button-shortcut" aria-hidden="true"><kbd class="sf-kbd--group"><kbd>Ctrl</kbd><span class="sf-kbd-join">+</span><kbd class="sf-kbd--square">C</kbd></kbd></span></button>
              <button type="button" role="menuitem" class="sf-button sf-button--ghost sf-button--on-surface sf-button--size-1/2" aria-keyshortcuts="Control+V"><span class="sf-button-text-container">Вставить</span><span class="sf-button-shortcut" aria-hidden="true"><kbd class="sf-kbd--group"><kbd>Ctrl</kbd><span class="sf-kbd-join">+</span><kbd class="sf-kbd--square">V</kbd></kbd></span></button>
              <button type="button" role="menuitem" class="sf-button sf-button--ghost sf-button--on-surface sf-button--size-1/2" aria-keyshortcuts="Control+Z"><span class="sf-button-text-container">Отменить</span><span class="sf-button-shortcut" aria-hidden="true"><kbd class="sf-kbd--group"><kbd>Ctrl</kbd><span class="sf-kbd-join">+</span><kbd class="sf-kbd--square">Z</kbd></kbd></span></button>
            </div>
          </div>
        </div>
      </div>
      <span class="text-1/2 color-on-surface-variant">в меню: знаки без плашек</span>
    </div>
  </div>
</div>
