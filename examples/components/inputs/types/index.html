<div class="grid grid-col-1 md:grid-col-2 gap-3">
  <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col">
    <span class="sf-input-label flex"><span class="sf-input-text">Рабочая почта</span></span>
    <span class="sf-input-field items-cross-center transition flex"><i class="sf-icon" aria-hidden="true">mail</i><input type="email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com"></span>
  </label>
  <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col">
    <span class="sf-input-label flex"><span class="sf-input-text">Пароль</span></span>
    <span class="sf-input-field items-cross-center transition flex"><i class="sf-icon" aria-hidden="true">lock</i><input type="password" name="password" autocomplete="current-password" minlength="8"></span>
  </label>
  <label class="sf-input sf-input--size-1 sf-input--filled flex flex-col">
    <span class="sf-input-label flex"><span class="sf-input-text">Поиск</span></span>
    <span class="sf-input-field items-cross-center transition flex"><i class="sf-icon" aria-hidden="true">search</i><input type="search" name="query" autocomplete="off" enterkeyhint="search"></span>
  </label>
  <label class="sf-input sf-input--size-1 sf-input--filled flex flex-col">
    <span class="sf-input-label flex"><span class="sf-input-text">Телефон</span></span>
    <span class="sf-input-field items-cross-center transition flex"><i class="sf-icon" aria-hidden="true">call</i><input type="tel" name="phone" autocomplete="tel" inputmode="tel"></span>
  </label>
</div>
