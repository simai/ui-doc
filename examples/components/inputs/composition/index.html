<div class="grid grid-col-1 md:grid-col-2 gap-4">
  <div class="flex flex-col gap-1">
    <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col"><span class="sf-input-label flex"><span class="sf-input-text">Обязательное поле</span><span class="sf-input-required" aria-hidden="true">*</span></span><span class="sf-input-field items-cross-center transition flex"><input type="text" required></span></label>
    <code class="text-1/2 color-on-surface-variant">sf-input-required + required</code>
  </div>
  <div class="flex flex-col gap-1">
    <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col"><span class="sf-input-label flex"><span class="sf-input-text">Поиск</span></span><span class="sf-input-field items-cross-center transition flex"><i class="sf-icon" aria-hidden="true">search</i><input type="search" name="query"></span></label>
    <code class="text-1/2 color-on-surface-variant">sf-icon в начале поля</code>
  </div>
  <div class="flex flex-col gap-1">
    <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col"><span class="sf-input-label flex"><span class="sf-input-text">Сумма</span></span><span class="sf-input-field items-cross-center transition flex"><input type="text" inputmode="decimal" name="amount"><span class="sf-input-right">₽</span></span></label>
    <code class="text-1/2 color-on-surface-variant">sf-input-right</code>
  </div>
  <div class="flex flex-col gap-1">
    <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col"><span class="sf-input-label flex"><span class="sf-input-text">Пароль</span></span><span class="sf-input-field items-cross-center transition flex"><input type="password" name="new-password" autocomplete="new-password"><i class="sf-icon sf-icon-hint" aria-hidden="true">info</i></span><span class="sf-input-hint-text-wrap">Не короче восьми символов</span></label>
    <code class="text-1/2 color-on-surface-variant">sf-icon-hint + sf-input-hint-text-wrap</code>
  </div>
</div>
