<label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col">
  <span class="sf-input-label flex"><span class="sf-input-text">Телефон</span></span>
  <span class="sf-input-field items-cross-center transition flex">
    <span class="sf-input-left">+7</span>
    <input type="tel" name="phone" autocomplete="tel-national" inputmode="tel" placeholder="(000) 000-00-00" data-mask="true" data-mask-pattern="(000) 000-00-00">
  </span>
  <span class="sf-input-hint-text-wrap">Десять цифр после кода страны</span>
</label>
