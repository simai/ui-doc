<div sf-asset="modal" class="hidden"></div>

<div class="flex flex-wrap gap-2">
  <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-backdrop-default"><span class="sf-button-text-container">overlay: true</span></button>
  <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-backdrop-blur"><span class="sf-button-text-container">blur: true</span></button>
  <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-backdrop-blur-large"><span class="sf-button-text-container">blur: 'large'</span></button>
  <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-backdrop-none"><span class="sf-button-text-container">overlay: false</span></button>
</div>
