<div data-sf-overlay-container>
  <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1" data-sf-modal-open="smart-modal-form">
    <span class="sf-button-text-container">Написать отзыв</span>
  </button>
  <p id="smart-modal-form-result" class="m-0" role="status"></p>

  <sf-modal modal-id="smart-modal-form" title="Отзыв" show-footer="false">
    <form slot="content" data-modal-form="feedback" class="flex flex-col gap-2">
      <label class="sf-input sf-input--size-1 sf-input--bordered flex flex-col">
        <span class="sf-input-label flex"><span class="sf-input-text">Почта</span></span>
        <span class="sf-input-field items-cross-center transition flex">
          <input type="email" name="email" autocomplete="email" required>
        </span>
      </label>
      <div class="flex flex-wrap gap-2">
        <button type="submit" class="sf-button sf-button--default sf-button--primary sf-button--size-1">
          <span class="sf-button-text-container">Отправить</span>
        </button>
        <button type="button" class="sf-button sf-button--link sf-button--on-surface sf-button--size-1" data-sf-modal-close="smart-modal-form">
          <span class="sf-button-text-container">Отмена</span>
        </button>
      </div>
    </form>
  </sf-modal>
</div>
