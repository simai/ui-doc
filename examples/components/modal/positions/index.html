<div id="modal-example-box">
  <div sf-asset="modal" class="hidden"></div>

  <div class="flex flex-wrap gap-2">
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-center"><span class="sf-button-text-container">center</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-left"><span class="sf-button-text-container">left</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-right"><span class="sf-button-text-container">right</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-inline-start"><span class="sf-button-text-container">inline-start</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-inline-end"><span class="sf-button-text-container">inline-end</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-top"><span class="sf-button-text-container">top</span></button>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1" data-sf-modal-open="modal-positions-bottom"><span class="sf-button-text-container">bottom</span></button>
  </div>
</div>
