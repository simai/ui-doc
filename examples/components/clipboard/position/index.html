<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-4">
    <div class="flex flex-col gap-2">
      <div class="relative p-2 radius-2 border border-outline-variant">
        <pre class="m-0 p-inline-end-3" id="clipboard-position-overlay">npm install @simai-studio/ui
npx sf init --lang ru
npm run dev</pre>
        <button type="button" class="sf-clipboard-surface sf-clipboard--overlay" data-sf-copy-target="#clipboard-position-overlay" aria-label="Копировать команду">
          <i class="sf-icon" aria-hidden="true">content_copy</i>
        </button>
      </div>
      <span class="text-1/2 color-on-surface-variant">sf-clipboard--overlay: блок в несколько строк</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="flex items-cross-center gap-1/2">
        <code id="clipboard-position-inline">npm install @simai-studio/ui</code>
        <button type="button" class="sf-clipboard-surface" data-sf-copy-target="#clipboard-position-inline" aria-label="Копировать команду">
          <i class="sf-icon" aria-hidden="true">content_copy</i>
        </button>
      </div>
      <span class="text-1/2 color-on-surface-variant">без модификатора: в строке после текста</span>
    </div>
  </div>
</div>
