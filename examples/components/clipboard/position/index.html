<div class="grid grid-col-1 md:grid-col-2 gap-3">
  <div class="flex flex-col gap-1">
    <div class="relative p-2 radius-2 border border-outline-variant">
      <code id="clipboard-position-overlay">npm install @simai/ui</code>
      <button type="button" class="sf-clipboard sf-clipboard-surface sf-clipboard--overlay" data-clipboard-target="#clipboard-position-overlay" aria-label="Копировать команду">
        <i class="sf-icon" aria-hidden="true">content_copy</i>
      </button>
    </div>
    <code class="text-1/2 color-on-surface-variant">sf-clipboard--overlay</code>
  </div>
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-1">
      <code id="clipboard-position-inline">npm install @simai/ui</code>
      <button type="button" class="sf-clipboard sf-clipboard-surface" data-clipboard-target="#clipboard-position-inline" aria-label="Копировать команду">
        <i class="sf-icon" aria-hidden="true">content_copy</i>
      </button>
    </div>
    <code class="text-1/2 color-on-surface-variant">без модификатора: в потоке</code>
  </div>
</div>
