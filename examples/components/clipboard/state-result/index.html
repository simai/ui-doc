<div class="flex flex-wrap gap-4 items-start">
  <div class="flex flex-col gap-1 items-start">
    <code class="text-1/2 color-on-surface-variant">data-success</code>
    <button type="button" class="sf-clipboard sf-clipboard-surface" data-copy="SF-2048" data-success="Код заказа скопирован" aria-label="Копировать код заказа">
      <i class="sf-icon" aria-hidden="true">content_copy</i>
    </button>
  </div>
  <div class="flex flex-col gap-1 items-start">
    <code class="text-1/2 color-on-surface-variant">data-error</code>
    <button type="button" class="sf-clipboard sf-clipboard-surface" data-target="#clipboard-missing-source" data-error="Не удалось скопировать" aria-label="Копировать значение без источника">
      <i class="sf-icon" aria-hidden="true">content_copy</i>
    </button>
  </div>
</div>
