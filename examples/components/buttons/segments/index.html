<div class="query-container">
  <div class="grid grid-col-1 gap-3">
    <div class="flex flex-col gap-2">
      <div role="group" aria-label="Начертание" class="flex">
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-start" aria-pressed="true"><span class="sf-button-text-container">Жирный</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-middle" aria-pressed="false"><span class="sf-button-text-container">Курсив</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-end" aria-pressed="false"><span class="sf-button-text-container">Подчёркнутый</span></button>
    </div>
      <span class="text-1/2 color-on-surface-variant">независимые переключатели: sf-button--outline в on-surface, aria-pressed</span>
    </div>
    <div class="flex flex-col gap-2">
      <div role="group" aria-label="Выравнивание текста" class="flex">
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-start"><span class="sf-button-text-container">Слева</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-middle"><span class="sf-button-text-container">По центру</span></button>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1 segment-end"><span class="sf-button-text-container">Справа</span></button>
    </div>
      <span class="text-1/2 color-on-surface-variant">все сегменты sf-button--outline</span>
    </div>
    <div class="flex flex-col gap-2">
      <div role="group" aria-label="Сохранение" class="flex">
      <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1 segment-start"><span class="sf-button-text-container">Сохранить</span></button>
      <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1 segment-end"><span class="sf-button-text-container">Сохранить как</span></button>
    </div>
      <span class="text-1/2 color-on-surface-variant">segment-start · segment-end: два сегмента sf-button--default</span>
    </div>
  </div>
</div>
