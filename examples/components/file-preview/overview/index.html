<div class="sf-file-preview flex flex-row flex-nowrap items-center max-w-md">
  <span class="sf-file-preview-holder">
    <i class="sf-icon" aria-hidden="true">description</i>
  </span>
  <span class="sf-file-preview-main flex flex-col flex-nowrap flex-1">
    <span class="sf-file-preview-name">Техническое задание.pdf</span>
    <span class="sf-file-preview-size">2,4 МБ</span>
  </span>
  <span class="sf-file-preview-actions flex flex-row flex-nowrap items-center">
    <button type="button" class="sf-icon-button neutral" aria-label="Скачать файл">
      <i class="sf-icon" aria-hidden="true">download</i>
    </button>
    <button type="button" class="sf-icon-button neutral" aria-label="Удалить файл">
      <i class="sf-icon" aria-hidden="true">delete</i>
    </button>
  </span>
</div>
