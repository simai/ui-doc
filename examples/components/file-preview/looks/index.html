<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-4 items-cross-start">
    <div class="flex flex-col gap-2">
      <div class="sf-file-preview sf-file-preview--chip">
        <span class="sf-file-preview-holder"><i class="sf-icon" aria-hidden="true">picture_as_pdf</i></span>
        <span class="sf-file-preview-main">
          <span class="sf-file-preview-name">Договор поставки.pdf</span>
          <span class="sf-file-preview-size">PDF · 1,2 МБ</span>
        </span>
        <span class="sf-file-preview-actions">
          <button type="button" class="sf-icon-button sf-icon-button--ghost sf-icon-button--on-surface sf-icon-button--size-1/2" aria-label="Убрать: Договор поставки.pdf"><i class="sf-icon" aria-hidden="true">close</i></button>
        </span>
      </div>
      <span class="text-1/2 color-on-surface-variant">sf-file-preview--chip</span>
    </div>
    <div class="flex flex-col gap-2">
      <div class="sf-file-preview sf-file-preview--tile max-w-f5">
        <span class="sf-file-preview-holder"><i class="sf-icon" aria-hidden="true">image</i></span>
        <span class="sf-file-preview-main">
          <span class="sf-file-preview-name">Обложка каталога.png</span>
          <span class="sf-file-preview-size">PNG · 840 КБ</span>
        </span>
        <span class="sf-file-preview-actions">
          <button type="button" class="sf-icon-button sf-icon-button--ghost sf-icon-button--on-surface sf-icon-button--size-1/2" aria-label="Скачать: Обложка каталога.png"><i class="sf-icon" aria-hidden="true">download</i></button>
          <button type="button" class="sf-icon-button sf-icon-button--ghost sf-icon-button--on-surface sf-icon-button--size-1/2" aria-label="Удалить: Обложка каталога.png"><i class="sf-icon" aria-hidden="true">delete</i></button>
        </span>
      </div>
      <span class="text-1/2 color-on-surface-variant">sf-file-preview--tile</span>
    </div>
  </div>
</div>
