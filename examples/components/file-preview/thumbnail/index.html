<div class="grid grid-col-1 gap-3">
  <div class="flex flex-col gap-1">
    <div class="sf-file-preview">
      <span class="sf-file-preview-holder"><i class="sf-icon" aria-hidden="true">description</i></span>
      <span class="sf-file-preview-main">
        <span class="sf-file-preview-name">Техническое задание.pdf</span>
        <span class="sf-file-preview-size">2,4 МБ</span>
      </span>
      <span class="sf-file-preview-actions">
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--link sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Скачать: Техническое задание.pdf"><i class="sf-icon" aria-hidden="true">download</i></button>
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--link sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Удалить: Техническое задание.pdf"><i class="sf-icon" aria-hidden="true">delete</i></button>
      </span>
    </div>
    <code class="text-1/2 color-on-surface-variant">sf-icon в sf-file-preview-holder</code>
  </div>
  <div class="flex flex-col gap-1">
    <div class="sf-file-preview">
      <span class="sf-file-preview-holder"><img class="sf-file-preview-thumbnail" src="assets/photo.jpg" alt=""></span>
      <span class="sf-file-preview-main">
        <span class="sf-file-preview-name">Портрет.jpg</span>
        <span class="sf-file-preview-size">190 КБ</span>
      </span>
      <span class="sf-file-preview-actions">
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--link sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Скачать: Портрет.jpg"><i class="sf-icon" aria-hidden="true">download</i></button>
        <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--link sf-icon-button--on-surface sf-icon-button--size-1" aria-label="Удалить: Портрет.jpg"><i class="sf-icon" aria-hidden="true">delete</i></button>
      </span>
    </div>
    <code class="text-1/2 color-on-surface-variant">sf-file-preview-thumbnail</code>
  </div>
</div>
