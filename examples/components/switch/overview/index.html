<section class="grid gap-4 max-w-sm items-main-start">
 <div class="grid gap-2">
 <div>Default</div>
 <label class="sf-switch sf-switch--size-1 flex">
 <span class="sf-switch-toggler transition flex items-cross-center content-main-start">
 <input type="checkbox" name="switch_default" />
 <span class="sf-switch-inner transition" aria-hidden="true"></span>
 </span>
 <span class="sf-switch-container-wrap flex flex-col">
 <span class="sf-switch-top flex">
 <span class="sf-switch-container flex items-cross-center content-main-center">
 <span class="sf-switch-text">Default switch</span>
 </span>
 <i class="sf-icon" aria-hidden="true">info</i>
 </span>
 <span class="sf-switch-description">Description text</span>
 </span>
 </label>
 </div>

 <div class="grid gap-2">
 <div>Checked</div>
 <label class="sf-switch sf-switch--size-1 flex">
 <span class="sf-switch-toggler transition flex items-cross-center content-main-start">
 <input type="checkbox" name="switch_checked" checked />
 <span class="sf-switch-inner transition" aria-hidden="true"></span>
 </span>
 <span class="sf-switch-container-wrap flex flex-col">
 <span class="sf-switch-top flex">
 <span class="sf-switch-container flex items-cross-center content-main-center">
 <span class="sf-switch-text">Enabled notifications</span>
 </span>
 <i class="sf-icon" aria-hidden="true">info</i>
 </span>
 </span>
 </label>
 </div>

 <div class="grid gap-2">
 <div>Disabled</div>
 <label class="sf-switch sf-switch--size-1 flex disabled">
 <span class="sf-switch-toggler transition flex items-cross-center content-main-start">
 <input type="checkbox" name="switch_disabled" disabled />
 <span class="sf-switch-inner transition" aria-hidden="true"></span>
 </span>
 <span class="sf-switch-container-wrap flex flex-col">
 <span class="sf-switch-top flex">
 <span class="sf-switch-container flex items-cross-center content-main-center">
 <span class="sf-switch-text">Disabled switch</span>
 </span>
 <i class="sf-icon" aria-hidden="true">info</i>
 </span>
 <span class="sf-switch-description">Unavailable state</span>
 </span>
 </label>
 </div>

 <div class="grid gap-2">
 <div>Disabled Checked</div>
 <label class="sf-switch sf-switch--size-1 flex disabled">
 <span class="sf-switch-toggler transition flex items-cross-center content-main-start">
 <input type="checkbox" name="switch_disabled_checked" checked disabled />
 <span class="sf-switch-inner transition" aria-hidden="true"></span>
 </span>
 <span class="sf-switch-container-wrap flex flex-col">
 <span class="sf-switch-top flex">
 <span class="sf-switch-container flex items-cross-center content-main-center">
 <span class="sf-switch-text">Disabled enabled state</span>
 </span>
 </span>
 </span>
 </label>
 </div>

 <div class="grid gap-2">
 <div>Compact</div>
 <label class="sf-switch sf-switch--size-1/3 flex">
 <span class="sf-switch-toggler transition flex items-cross-center content-main-start">
 <input type="checkbox" name="switch_compact" checked />
 <span class="sf-switch-inner transition" aria-hidden="true"></span>
 </span>
 <span class="sf-switch-container-wrap flex flex-col">
 <span class="sf-switch-top flex">
 <span class="sf-switch-container flex items-cross-center content-main-center">
 <span class="sf-switch-text">Compact</span>
 </span>
 </span>
 </span>
 </label>
 </div>
</section>
