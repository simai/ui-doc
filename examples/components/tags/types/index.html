<div class="flex flex-wrap gap-2 items-center">
  <button type="button" class="sf-tag sf-tag--checkbox sf-tag--size-1 sf-tag--interactive inline-flex flex-row flex-nowrap items-center" aria-pressed="false">
    <span class="sf-tag-check" aria-hidden="true"></span>
    <span class="sf-tag-container">Дизайн</span>
  </button>
  <div class="sf-tag sf-tag--icon sf-tag--size-1 inline-flex flex-row flex-nowrap items-center">
    <i class="sf-icon sf-tag-icon" aria-hidden="true">favorite</i>
    <span class="sf-tag-container">Избранное</span>
  </div>
  <div class="sf-tag sf-tag--color sf-tag--size-1 inline-flex flex-row flex-nowrap items-center">
    <span class="sf-tag-color-icon bg-tertiary" aria-hidden="true"></span>
    <span class="sf-tag-container">Фиолетовый</span>
  </div>
  <div class="sf-tag sf-tag--avatar sf-tag--size-1 inline-flex flex-row flex-nowrap items-center">
    <span class="sf-avatar sf-avatar--text sf-avatar--size-1/4 flex items-center justify-center" aria-hidden="true"><span class="sf-avatar-text">АБ</span></span>
