<section class="flex flex-col gap-4">
 <section class="flex flex-col gap-1">
 <h3 class="text-3">Context menu</h3>
 <div class="text-1/2 color-on-surface-variant">
 Base component example using the regular <code>.sf-context-menu</code> CSS structure.
 </div>
 </section>

 <section class="grid grid-col-1 md:grid-col-2 gap-3">
 <div class="flex flex-col gap-1 items-cross-start">
 <div class="text-1 weight-6">Top left</div>
 <div class="sf-context-menu sf-context-menu--position-top-left flex relative">
 <div class="sf-context-menu-tooltip" aria-hidden="true"></div>
 <div class="sf-context-menu-content flex flex-col flex-1">
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Edit</span>
 </button>
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Duplicate</span>
 </button>
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Delete</span>
 </button>
 </div>
 </div>
 </div>

 <div class="flex flex-col gap-1 items-cross-start">
 <div class="text-1 weight-6">Right</div>
 <div class="sf-context-menu sf-context-menu--position-right flex relative">
 <div class="sf-context-menu-tooltip" aria-hidden="true"></div>
 <div class="sf-context-menu-content flex flex-col flex-1">
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Edit</span>
 </button>
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Duplicate</span>
 </button>
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2 justify-start"
 >
 <span class="sf-button-text-container">Delete</span>
 </button>
 </div>
 </div>
 </div>

 <div class="flex flex-col gap-1 items-cross-start">
 <div class="text-1 weight-6">Bottom center</div>
 <div class="sf-context-menu sf-context-menu--position-bottom-center flex relative">
 <div class="sf-context-menu-tooltip" aria-hidden="true"></div>
 <div class="sf-context-menu-content flex flex-col flex-1">
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2"
 >
 <i class="sf-icon">share</i>
 <span class="sf-button-text-container">Share</span>
 </button>
 <button
 type="button"
 class="sf-button flex sf-button--link sf-button--on-surface sf-button--size-1/2"
 >
 <i class="sf-icon">download</i>
 <span class="sf-button-text-container">Download</span>
 </button>

 </div>
 </div>
 </div>

 <div class="flex flex-col gap-1 items-cross-start">
 <div class="text-1 weight-6">Without tooltip</div>
 <div class="sf-context-menu flex relative">
 <div class="sf-context-menu-content flex flex-col flex-1">
 <div class="p-x-1 p-y-1/2">Static content block</div>
 <div class="p-x-1 p-y-1/2 color-on-surface-variant">No tail rendered</div>
 </div>
 </div>
 </div>
 </section>
</section>
