<div class="grid grid-col-1 gap-2">
  <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input name="plain" type="checkbox"><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container flex flex-col"><span class="sf-checkbox-label">Обычный</span></span></label>
  <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input name="checked" type="checkbox" checked><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container flex flex-col"><span class="sf-checkbox-label">Выбранный</span></span></label>
  <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input name="mixed" type="checkbox" data-indeterminate><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container flex flex-col"><span class="sf-checkbox-label">Выбрана часть элементов</span></span></label>
  <label class="sf-checkbox error sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input name="required-choice" type="checkbox" aria-invalid="true"><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container flex flex-col"><span class="sf-checkbox-label">Требуется выбор</span><span class="sf-checkbox-description">Подтвердите условие</span></span></label>
  <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input name="disabled" type="checkbox" disabled><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container flex flex-col"><span class="sf-checkbox-label">Недоступный</span></span></label>
</div>
