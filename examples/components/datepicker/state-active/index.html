<div class="sf-datepicker flex flex-col gap-1" role="group" aria-label="Выбранный день">
  <div class="sf-datepicker-row grid grid-col-7" aria-hidden="true"><span class="sf-datepicker-weekday">Пн</span><span class="sf-datepicker-weekday">Вт</span><span class="sf-datepicker-weekday">Ср</span><span class="sf-datepicker-weekday">Чт</span><span class="sf-datepicker-weekday">Пт</span><span class="sf-datepicker-weekday">Сб</span><span class="sf-datepicker-weekday">Вс</span></div>
  <div class="sf-datepicker-row grid grid-col-7">
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="14 сентября 2026"><span class="sf-datepicker-day-date">14</span></button>
    <button class="sf-datepicker-day active flex flex-col content-main-center items-cross-center" type="button" aria-label="15 сентября 2026, выбрано" aria-pressed="true"><span class="sf-datepicker-day-date">15</span></button>
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="16 сентября 2026"><span class="sf-datepicker-day-date">16</span></button>
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="17 сентября 2026"><span class="sf-datepicker-day-date">17</span></button>
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="18 сентября 2026"><span class="sf-datepicker-day-date">18</span></button>
    <button class="sf-datepicker-day sf-datepicker-day-off flex flex-col content-main-center items-cross-center" type="button" aria-label="19 сентября 2026, выходной"><span class="sf-datepicker-day-date">19</span></button>
    <button class="sf-datepicker-day sf-datepicker-day-off flex flex-col content-main-center items-cross-center" type="button" aria-label="20 сентября 2026, выходной"><span class="sf-datepicker-day-date">20</span></button>
  </div>
  <code class="text-1/2 color-on-surface-variant">active — 15</code>
</div>
