<div class="sf-datepicker flex flex-col gap-1" role="group" aria-label="Виды дней">
  <div class="sf-datepicker-row grid grid-col-7" aria-hidden="true"><span class="sf-datepicker-weekday">Пн</span><span class="sf-datepicker-weekday">Вт</span><span class="sf-datepicker-weekday">Ср</span><span class="sf-datepicker-weekday">Чт</span><span class="sf-datepicker-weekday">Пт</span><span class="sf-datepicker-weekday">Сб</span><span class="sf-datepicker-weekday">Вс</span></div>
  <div class="sf-datepicker-row grid grid-col-7">
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="28 сентября 2026"><span class="sf-datepicker-day-date">28</span></button>
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="29 сентября 2026, 3 события"><span class="sf-datepicker-day-date">29</span><span class="sf-datepicker-day-info">3</span></button>
    <button class="sf-datepicker-day flex flex-col content-main-center items-cross-center" type="button" aria-label="30 сентября 2026"><span class="sf-datepicker-day-date">30</span></button>
    <button class="sf-datepicker-day sf-datepicker-another-month flex flex-col content-main-center items-cross-center" type="button" aria-label="1 октября 2026"><span class="sf-datepicker-day-date">1</span></button>
    <button class="sf-datepicker-day sf-datepicker-another-month flex flex-col content-main-center items-cross-center" type="button" aria-label="2 октября 2026"><span class="sf-datepicker-day-date">2</span></button>
    <button class="sf-datepicker-day sf-datepicker-another-month sf-datepicker-day-off flex flex-col content-main-center items-cross-center" type="button" aria-label="3 октября 2026, выходной"><span class="sf-datepicker-day-date">3</span></button>
    <button class="sf-datepicker-day sf-datepicker-another-month sf-datepicker-day-off flex flex-col content-main-center items-cross-center" type="button" aria-label="4 октября 2026, выходной"><span class="sf-datepicker-day-date">4</span></button>
  </div>
  <code class="text-1/2 color-on-surface-variant">sf-datepicker-day-info — 29</code>
  <code class="text-1/2 color-on-surface-variant">sf-datepicker-day-off — сб и вс</code>
  <code class="text-1/2 color-on-surface-variant">sf-datepicker-another-month — 1–4 октября</code>
</div>
