<div class="sf-datepicker flex flex-col gap-2" role="group" aria-label="Выбор месяца">
  <div class="flex flex-col gap-1">
    <div class="grid grid-col-3 gap-1">
      <button class="sf-datepicker-text flex content-main-center items-cross-center" type="button"><span class="sf-datepicker-day-date">Январь</span></button>
      <button class="sf-datepicker-text active flex content-main-center items-cross-center" type="button" aria-pressed="true"><span class="sf-datepicker-day-date">Февраль</span></button>
      <button class="sf-datepicker-text disabled flex content-main-center items-cross-center" type="button" disabled><span class="sf-datepicker-day-date">Март</span></button>
    </div>
    <code class="text-1/2 color-on-surface-variant">active — февраль, disabled — март</code>
  </div>
  <div class="flex flex-col gap-1">
    <div class="grid grid-col-3">
      <button class="sf-datepicker-text sf-datepicker-text-start flex content-main-center items-cross-center" type="button" aria-pressed="true"><span class="sf-datepicker-day-date">Апрель</span></button>
      <button class="sf-datepicker-text sf-datepicker-text-selected flex content-main-center items-cross-center" type="button" aria-pressed="true"><span class="sf-datepicker-day-date">Май</span></button>
      <button class="sf-datepicker-text sf-datepicker-text-end flex content-main-center items-cross-center" type="button" aria-pressed="true"><span class="sf-datepicker-day-date">Июнь</span></button>
    </div>
    <code class="text-1/2 color-on-surface-variant">sf-datepicker-text-start → text-selected → text-end — апрель–июнь</code>
  </div>
</div>
