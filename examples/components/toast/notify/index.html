<section class="flex flex-wrap gap-2" aria-label="Уведомления страницы" data-notify-demo>
  <button type="button" class="sf-button sf-button--default sf-button--primary sf-button--size-1" data-notify="success">
    <span class="sf-button-text-container">Сохранить</span>
  </button>
  <button type="button" class="sf-button sf-button--outline sf-button--secondary sf-button--size-1" data-notify="error">
    <span class="sf-button-text-container">Ошибка оплаты</span>
  </button>
  <p class="text-1/2 color-on-surface-variant w-full" data-notify-log aria-live="polite"></p>
</section>
