<div class="grid grid-col-1 gap-3 max-w-xl" data-toast-lifetime-demo>
  <div class="flex flex-col gap-1">
    <div class="sf-toast sf-toast--neutral flex items-cross-start">
      <i class="sf-icon" aria-hidden="true">info</i>
      <div class="sf-toast-container flex flex-col flex-1">
        <div class="sf-toast-wrap flex flex-col">
          <div class="sf-toast-text">Постоянное сообщение</div>
          <div class="sf-toast-supporting-text">Остаётся, пока его не закроют.</div>
        </div>
      </div>
      <button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--on-surface sf-icon-button--link sf-icon-button--size-1/3" data-close aria-label="Закрыть сообщение">
        <span class="sf-close sf-close--size-1/3 flex justify-center items-center" aria-hidden="true"><span class="sf-close-icon"></span></span>
      </button>
    </div>
    <code class="text-1/2 color-on-surface-variant">без data-duration</code>
  </div>
  <div class="flex flex-col gap-1">
    <div data-toast-lifetime-slot>
    <div class="sf-toast sf-toast--success flex items-cross-start" data-duration="8000">
      <i class="sf-icon" aria-hidden="true">check_circle</i>
      <div class="sf-toast-container flex flex-col flex-1">
        <div class="sf-toast-wrap flex flex-col">
          <div class="sf-toast-text">Временное сообщение</div>
          <div class="sf-toast-supporting-text">Закрывается через 8 секунд; наведение и фокус останавливают отсчёт.</div>
        </div>
      </div>
      <button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--on-surface sf-icon-button--link sf-icon-button--size-1/3" data-close aria-label="Закрыть сообщение">
        <span class="sf-close sf-close--size-1/3 flex justify-center items-center" aria-hidden="true"><span class="sf-close-icon"></span></span>
      </button>
    </div>
    </div>
    <template data-toast-lifetime-template>
    <div class="sf-toast sf-toast--success flex items-cross-start" data-duration="8000">
      <i class="sf-icon" aria-hidden="true">check_circle</i>
      <div class="sf-toast-container flex flex-col flex-1">
        <div class="sf-toast-wrap flex flex-col">
          <div class="sf-toast-text">Временное сообщение</div>
          <div class="sf-toast-supporting-text">Закрывается через 8 секунд; наведение и фокус останавливают отсчёт.</div>
        </div>
      </div>
      <button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--on-surface sf-icon-button--link sf-icon-button--size-1/3" data-close aria-label="Закрыть сообщение">
        <span class="sf-close sf-close--size-1/3 flex justify-center items-center" aria-hidden="true"><span class="sf-close-icon"></span></span>
      </button>
    </div>
    </template>
    <code class="text-1/2 color-on-surface-variant">data-duration="8000"</code>
    <div>
      <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-toast-lifetime-restore hidden>
        <span class="sf-button-text-container">Показать снова</span>
      </button>
    </div>
  </div>
</div>
