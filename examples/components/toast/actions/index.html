<section class="grid grid-col-1 gap-2 max-w-xl" aria-label="Интерактивный пример сообщения" data-toast-demo>
  <div data-toast-demo-slot>
    <div class="sf-toast sf-toast--success flex items-cross-start">
      <i class="sf-icon" aria-hidden="true">check_circle</i>
      <div class="sf-toast-container flex flex-col flex-1">
        <div class="sf-toast-wrap flex flex-col">
          <div class="sf-toast-text">Файл удалён</div>
          <div class="sf-toast-supporting-text">Действие можно отменить.</div>
        </div>
        <div class="sf-toast-bottom flex flex-wrap items-center">
          <button type="button" class="sf-button sf-button--link sf-button--primary sf-button--size-1/2" data-action="undo">
            <span class="sf-button-text-container">Отменить</span>
          </button>
        </div>
      </div>
      <button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--on-surface sf-icon-button--link sf-icon-button--size-1/3" data-close aria-label="Закрыть сообщение">
        <span class="sf-close sf-close--size-1/3 flex justify-center items-center" aria-hidden="true"><span class="sf-close-icon"></span></span>
      </button>
    </div>
  </div>
  <p class="m-0" role="status" data-toast-demo-result></p>
  <div>
    <button type="button" class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1/2" data-toast-demo-restore hidden>
      <span class="sf-button-text-container">Показать снова</span>
    </button>
  </div>
  <template data-toast-demo-template>
    <div class="sf-toast sf-toast--success flex items-cross-start">
      <i class="sf-icon" aria-hidden="true">check_circle</i>
      <div class="sf-toast-container flex flex-col flex-1">
        <div class="sf-toast-wrap flex flex-col">
          <div class="sf-toast-text">Файл удалён</div>
          <div class="sf-toast-supporting-text">Действие можно отменить.</div>
        </div>
        <div class="sf-toast-bottom flex flex-wrap items-center">
          <button type="button" class="sf-button sf-button--link sf-button--primary sf-button--size-1/2" data-action="undo">
            <span class="sf-button-text-container">Отменить</span>
          </button>
        </div>
      </div>
      <button type="button" class="sf-icon-button sf-icon-button--close sf-icon-button--on-surface sf-icon-button--link sf-icon-button--size-1/3" data-close aria-label="Закрыть сообщение">
        <span class="sf-close sf-close--size-1/3 flex justify-center items-center" aria-hidden="true"><span class="sf-close-icon"></span></span>
      </button>
    </div>
  </template>
</section>
