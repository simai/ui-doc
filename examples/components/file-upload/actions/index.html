<div class="grid grid-col-1 gap-2">
  <div class="sf-file-upload sf-file-upload--size-1 flex flex-col items-cross-center" aria-label="Выбрать файл"><span class="sf-file-upload-link">Выбрать файл</span></div>
<div class="sf-file-upload-files grid grid-col-1 gap-1 w-full"></div>
  <output class="color-on-surface-variant" aria-live="polite">Ожидание действия</output>
</div>
<script>
  addEventListener('docara:example-ready', () => {
    const upload = document.querySelector('.sf-file-upload');
    const output = document.querySelector('output');
    SF.FileUpload.setItems(upload, [{ name: 'report.pdf', fileSize: '1,7 МБ', state: 'error', errorMessage: 'Повторить' }]);
    upload.addEventListener('sf-file-upload:retry', () => { output.value = 'Приложение повторяет передачу'; });
    upload.addEventListener('sf-file-upload:remove', () => { output.value = 'Файл удалён из списка'; });
  }, { once: true });
</script>
