<div class="grid grid-col-1 gap-2">
  <div class="sf-file-upload sf-file-upload--size-1 flex flex-col items-cross-center" accept=".pdf,.png,.jpg,.jpeg" multiple aria-label="Выбрать документы">
    <div class="sf-featured-icon sf-featured-icon--size-1 sf-featured-icon--soft sf-featured-icon--circle sf-featured-icon--neutral"><i class="sf-icon" aria-hidden="true">upload_file</i></div>
    <div class="sf-file-upload-bottom flex flex-col items-cross-center"><div class="sf-file-upload-block flex"><div class="sf-file-upload-block-text"><span class="sf-file-upload-link">Выберите документы</span> или перетащите их сюда</div></div><span class="sf-file-upload-text">PDF, PNG или JPG</span></div>
  </div>
  <div class="sf-file-upload-files grid grid-col-1 gap-1 w-full"></div>
  <output class="color-on-surface-variant" aria-live="polite">Файлы не выбраны</output>
</div>
<script>
  document.querySelector('.sf-file-upload').addEventListener('sf-file-upload:select', (event) => {
    document.querySelector('output').value = `Выбрано файлов: ${event.detail.files.length}`;
  });
</script>
