<div class="sf-file-upload sf-file-upload--size-1 flex flex-col items-cross-center" aria-label="Добавить ещё файлы"><span class="sf-file-upload-link">Добавить файлы</span></div>
<div class="sf-file-upload-files grid grid-col-1 gap-1 w-full"></div>
<script>
  addEventListener('docara:example-ready', () => {
    SF.FileUpload.setItems(document.querySelector('.sf-file-upload'), [
      { name: 'presentation.pdf', fileSize: '2,4 МБ', progress: 65, state: 'process' },
      { name: 'logo.svg', fileSize: '84 КБ', progress: 100, state: 'done' },
      { name: 'archive.zip', fileSize: '8,1 МБ', state: 'error', errorMessage: 'Повторить' },
    ]);
  }, { once: true });
</script>
