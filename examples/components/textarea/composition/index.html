<div class="grid grid-col-1 md:grid-col-3 gap-4">
  <div class="flex flex-col gap-1">
    <label class="sf-textarea sf-textarea--size-1 sf-textarea--bordered flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">Только подпись</span></span><textarea class="transition" rows="3"></textarea></label>
    <code class="text-1/2 color-on-surface-variant">sf-textarea-label</code>
  </div>
  <div class="flex flex-col gap-1">
    <label class="sf-textarea sf-textarea--size-1 sf-textarea--bordered flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">Обязательное поле</span><span class="sf-textarea-required" aria-hidden="true">*</span></span><textarea class="transition" rows="3" required></textarea></label>
    <code class="text-1/2 color-on-surface-variant">sf-textarea-required + required</code>
  </div>
  <div class="flex flex-col gap-1">
    <label class="sf-textarea sf-textarea--size-1 sf-textarea--bordered flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">С подсказкой</span></span><textarea class="transition" rows="3"></textarea><span class="sf-textarea-hint-text-wrap">Подсказка остаётся под полем</span></label>
    <code class="text-1/2 color-on-surface-variant">sf-textarea-hint-text-wrap</code>
  </div>
</div>
