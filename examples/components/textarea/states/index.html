<div class="grid grid-col-1 md:grid-col-2 gap-3">
  <label class="sf-textarea sf-textarea--size-1 sf-textarea--bordered flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">Обязательное поле</span><span class="sf-textarea-required" aria-hidden="true">*</span></span><textarea class="transition" rows="3" required></textarea></label>
  <label class="sf-textarea sf-textarea--size-1 sf-textarea--bordered error flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">Описание</span></span><textarea class="transition error" rows="3" aria-invalid="true" aria-describedby="textarea-error"></textarea><span id="textarea-error" class="sf-textarea-hint-text-wrap">Добавьте не менее десяти символов</span></label>
  <label class="sf-textarea sf-textarea--size-1 sf-textarea--filled flex flex-col"><span class="sf-textarea-label flex"><span class="sf-textarea-text">Недоступное поле</span></span><textarea class="transition" rows="3" disabled>Изменение запрещено</textarea></label>
</div>
