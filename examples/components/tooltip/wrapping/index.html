<div class="flex content-main-center p-8">
  <span class="sf-tooltip-anchor">
    <button type="button"
      class="sf-button sf-button--outline sf-button--on-surface sf-button--size-1"
      data-tooltip="long-tooltip" aria-describedby="long-tooltip">
      <span class="sf-button-text-container">Ограничения</span>
    </button>
    <span id="long-tooltip"
      class="sf-tooltip sf-tooltip--light sf-tooltip--size-1"
      hidden>
      <span class="sf-tooltip-content flex flex-col">
        <span class="sf-tooltip-wrap flex flex-col">
          <span class="sf-tooltip-text">Перед публикацией проверьте права доступа</span>
          <span class="sf-tooltip-supporting-text">Права проверяются перед публикацией каждой версии, включая гостевые ссылки и приглашения.</span>
        </span>
        <span class="sf-tooltip-tail" aria-hidden="true"></span>
      </span>
    </span>
  </span>
</div>
