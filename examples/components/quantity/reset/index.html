<form class="grid grid-col-1 gap-2">
  <label class="sf-quantity sf-quantity--size-1 flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Количество по умолчанию — 3</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить количество"><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" name="quantity" value="3" inputmode="numeric" min="1" max="9" step="1">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить количество"><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
  </label>
  <button type="reset" class="sf-button sf-button--secondary sf-button--outlined sf-button--size-1">Вернуть значение 3</button>
</form>
