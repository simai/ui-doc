<div class="grid grid-col-1 md:grid-col-3 gap-3">
  <label class="sf-quantity sf-quantity--size-1 error flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Участники</span><span class="sf-quantity-required" aria-hidden="true">*</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить число участников"><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" value="0" inputmode="numeric" required aria-invalid="true" aria-describedby="quantity-error">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить число участников"><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
    <span id="quantity-error" class="text-error text-size-1/2">Укажите хотя бы одного участника.</span>
  </label>
  <label class="sf-quantity sf-quantity--size-1 flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Только для чтения</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить значение"><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" value="4" inputmode="numeric" readonly>
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить значение"><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
  </label>
  <label class="sf-quantity sf-quantity--size-1 flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Недоступно</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить значение" disabled><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" value="2" inputmode="numeric" disabled>
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить значение" disabled><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
  </label>
</div>
