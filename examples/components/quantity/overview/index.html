<label class="sf-quantity sf-quantity--size-1 flex flex-col">
  <span class="sf-quantity-label flex">
    <span class="sf-quantity-text">Количество мест</span>
    <span class="sf-quantity-required" aria-hidden="true">*</span>
  </span>
  <span class="sf-quantity-wrap flex content-main-center items-cross-center">
    <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить количество мест"><i class="sf-icon" aria-hidden="true">remove</i></button>
    <input type="text" name="places" value="2" inputmode="numeric" min="1" max="10" step="1" required>
    <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить количество мест"><i class="sf-icon" aria-hidden="true">add</i></button>
  </span>
</label>
