<div class="grid grid-col-1 md:grid-col-2 gap-3">
  <label class="sf-quantity sf-quantity--size-1 flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Русский формат</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Уменьшить значение"><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" value="1234.5" inputmode="decimal" step="0.01" data-locale="ru-RU" data-precision="2" data-grouping="true" data-allow-decimal="true">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Увеличить значение"><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
  </label>
  <label class="sf-quantity sf-quantity--size-1 flex flex-col">
    <span class="sf-quantity-label flex"><span class="sf-quantity-text">Английский формат без группировки</span></span>
    <span class="sf-quantity-wrap flex content-main-center items-cross-center">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Decrease value"><i class="sf-icon" aria-hidden="true">remove</i></button>
      <input type="text" value="1234.5" inputmode="decimal" step="0.1" data-locale="en-US" data-precision="1" data-grouping="false" data-allow-decimal="true">
      <button type="button" class="sf-quantity-count sf-icon-button sf-icon-button--secondary sf-icon-button--tonal sf-icon-button--size-1/3 flex" aria-label="Increase value"><i class="sf-icon" aria-hidden="true">add</i></button>
    </span>
  </label>
</div>
