<div class="flex flex-col gap-2">
  <div class="flex"><sf-segmented id="upload-state" size="1/2" aria-label="Что происходит" value="run"
    items='[{"value":"empty","label":"Пусто"},{"value":"run","label":"Идёт"},{"value":"error","label":"Ошибка"},{"value":"many","label":"48 фото"},{"value":"done","label":"Готово"}]'></sf-segmented></div>
  <div class="flex flex-col gap-1 max-w-g8">
    <h3 class="m-0 text-1 weight-medium">Документы к новости «Осенняя распродажа»</h3>
    <sf-file-upload id="upload" multiple max-size="20971520" link-text="Выберите файлы" text="или перетащите их сюда"
      formats="PDF, DOCX, XLSX, JPG или PNG, до 20 МБ" accept=".pdf,.docx,.xlsx,.jpg,.jpeg,.png"></sf-file-upload>
  </div>
  <div id="corner" class="upload-corner" hidden>
    <sf-progress-run id="batch" look="notice" label="Загрузка фото в «Галерея / Осень 2026»" unit="файлов" cancelable minimizable></sf-progress-run>
  </div>
</div>
