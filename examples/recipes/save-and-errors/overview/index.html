<div class="flex flex-col gap-2">
  <div class="flex"><sf-segmented id="answer" size="1/2" aria-label="Что ответит сервер" value="ok"
    items='[{"value":"ok","label":"Сохранится"},{"value":"errors","label":"3 ошибки"},{"value":"conflict","label":"Чужая правка"},{"value":"offline","label":"Нет связи"}]'></sf-segmented></div>
  <div class="flex flex-col gap-1 max-w-g6">
    <div class="flex flex-wrap items-cross-baseline gap-1/2">
      <h3 class="m-0 text-2 weight-5">Осенняя распродажа</h3>
      <span class="text-1/2 color-on-surface-variant">Новости · черновик · изменено сегодня в 14:05</span>
    </div>
    <div id="summary"></div>
    <sf-tabs id="record-tabs" aria-label="Разделы записи" items='[{"id":"main","label":"Основное"},{"id":"seo","label":"Поиск"},{"id":"access","label":"Доступ"}]'>
      <div slot="panel-0" class="flex flex-col gap-1 p-top-1">
        <sf-input id="f-title" name="title" label="Заголовок" required default-value="Осенняя распродажа"></sf-input>
        <sf-input id="f-slug" name="slug" label="Адрес страницы" required default-value="osennyaya-rasprodazha" hint="Латинские буквы, цифры и дефис." text-end=".html"></sf-input>
      </div>
      <div slot="panel-1" class="flex flex-col gap-1 p-top-1">
        <sf-input id="f-seo-title" name="seo-title" label="Заголовок для поиска" default-value="Осенняя распродажа" hint="До 70 знаков."></sf-input>
        <sf-input id="f-seo-desc" name="seo-desc" label="Описание для поиска" required hint="Одно-два предложения, до 160 знаков."></sf-input>
      </div>
      <div slot="panel-2" class="flex flex-col gap-1 p-top-1">
        <sf-input id="f-group" name="group" label="Кто видит" default-value="Все посетители"></sf-input>
      </div>
    </sf-tabs>
    <div class="flex flex-col gap-1/2 m-top-2">
      <div class="flex flex-wrap gap-1/3">
        <sf-button id="save" text="Сохранить"></sf-button>
        <sf-button id="cancel" appearance="ghost" scheme="on-surface" text="Отмена"></sf-button>
      </div>
      <p id="dirty" class="m-0 text-1/2 color-on-surface-variant" hidden>Есть несохранённые изменения</p>
    </div>
  </div>
</div>
