<div class="look" data-sf-density="compact">
  <div class="flex flex-col gap-1 min-w-0">
    <sf-input-color id="brand" variant="brand" label="Фирменный цвет" name="brand" value="#0b57d0" swatches="#0b57d0|Синий SIMAI, #e8a33d|Логотип, #1a7f37|Зелёный" target="#sample" clearable></sf-input-color>
    <div class="flex flex-col gap-1/4">
      <span id="theme-label" class="text-1/2 color-on-surface-variant">Тема сайта</span>
      <sf-segmented id="site-theme" aria-labelledby="theme-label" name="theme" value="system" items='[{"value":"light","label":"Светлая"},{"value":"dark","label":"Тёмная"},{"value":"system","label":"Как в системе"}]'></sf-segmented>
    </div>
    <sf-alert id="save-error" status="error" heading="Оформление не сохранено" supporting-text="Сервер не ответил. Сайт показывает прежние цвета — нажмите «Сохранить» ещё раз." hidden></sf-alert>
    <div class="flex flex-wrap items-cross-center gap-1/3">
      <sf-button id="save" text="Сохранить"></sf-button>
      <sf-button id="reset" text="Вернуть цвет SIMAI" appearance="ghost" scheme="on-surface"></sf-button>
    </div>
    <p id="look-status" class="m-0 text-1/2 color-on-surface-variant" role="status"></p>
    <sf-switch id="look-fail" label="Сервер ответит ошибкой"></sf-switch>
  </div>
  <div class="sample" id="sample" aria-label="Образец сайта">
    <div class="sample-head"><span class="sf-icon" aria-hidden="true">water_pump</span><b>Аквабур</b><span class="m-inline-start-auto">Каталог · Доставка · Контакты</span></div>
    <div class="sample-cover"><p class="m-0 text-2 weight-medium">Насосы для дома и дачи</p><p class="m-0">Доставим завтра, установим за день</p></div>
    <div class="sample-body">
      <div class="sample-card"><b>Аквабур-40</b><span>12 490 ₽</span><sf-button size="1/2" text="В корзину"></sf-button></div>
      <div class="sample-card"><b>Аквабур-25</b><span>8 990 ₽</span><sf-button size="1/2" text="В корзину"></sf-button></div>
    </div>
  </div>
</div>
