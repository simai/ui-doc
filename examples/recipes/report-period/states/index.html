<div class="grid grid-col-1 cq-md:grid-col-2 gap-2 query-container" data-sf-density="compact">
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-input-date range label="Период" presets="today,yesterday,last-7-days,last-30-days,this-month,last-month" locale="ru"></sf-input-date>
    <figcaption class="text-1/2 color-on-surface-variant">Период не выбран: поле показывает формат дат языка</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-input-date range label="Период" start-value="2024-09-01" end-value="2026-11-14" invalid error-message="Не больше года: отчёт за два года — в разделе «Сводка»." locale="ru"></sf-input-date>
    <figcaption class="text-1/2 color-on-surface-variant">Ошибка: период длиннее года</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-input-date range label="Период" start-value="2026-10-01" end-value="2026-10-31" readonly locale="ru"></sf-input-date>
    <figcaption class="text-1/2 color-on-surface-variant">Только чтение: период задан отчётом, календарь не открывается</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <div class="tiles" aria-busy="true">
      <div class="flex flex-col gap-1/4 p-1 radius-surface border border-outline-variant"><sf-skeleton size="1/2" width="40%"></sf-skeleton><sf-skeleton size="2" width="60%"></sf-skeleton></div>
      <div class="flex flex-col gap-1/4 p-1 radius-surface border border-outline-variant"><sf-skeleton size="1/2" width="40%"></sf-skeleton><sf-skeleton size="2" width="60%"></sf-skeleton></div>
    </div>
    <figcaption class="text-1/2 color-on-surface-variant">Пересчёт: цифры отчёта — заготовка их размера</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-empty-state kind="nothing-found" size="1/2" heading="За этот период заказов нет" text="Выберите период длиннее или «Прошлый месяц»."></sf-empty-state>
    <figcaption class="text-1/2 color-on-surface-variant">Пусто: за период ничего нет — что сделать</figcaption>
  </figure>
</div>
