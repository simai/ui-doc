<div class="grid grid-col-1 cq-md:grid-col-2 gap-2 query-container">
  <figure class="m-0 flex flex-col gap-1/2">
    <div class="booking"><sf-input-date label="Заезд" value="2026-12-27" locale="ru"></sf-input-date><sf-input-date label="Выезд" value="2026-12-30" locale="ru"></sf-input-date></div>
    <figcaption class="text-1/2 color-on-surface-variant">Обычная — сайт бронирования</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2" data-sf-density="compact">
    <div class="period-bar"><sf-input-date range label="Период" presets="last-7-days,this-month,last-month" preset="this-month" locale="ru"></sf-input-date><sf-segmented aria-label="Шаг отчёта" value="day" items="day::По дням|month::По месяцам"></sf-segmented></div>
    <figcaption class="text-1/2 color-on-surface-variant">Компактная — отчёт в админке</figcaption>
  </figure>
</div>
