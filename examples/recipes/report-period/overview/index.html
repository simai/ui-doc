<div class="flex flex-col gap-1" data-sf-density="compact">
  <div class="period-bar">
    <sf-input-date id="period" range label="Период" presets="today,yesterday,last-7-days,last-30-days,this-month,last-month" preset="last-7-days" locale="ru"></sf-input-date>
    <sf-segmented id="period-step" aria-label="Шаг отчёта" value="day" items="day::По дням|week::По неделям|month::По месяцам"></sf-segmented>
  </div>
  <div id="report" class="tiles" aria-live="polite"></div>
</div>
