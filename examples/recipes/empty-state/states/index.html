<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="first-use" size="1/2" heading="Товаров пока нет" text="Добавьте первый товар — с ним магазин начнёт принимать заказы."><sf-button slot="actions" icon-start="add" text="Добавить товар"></sf-button></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Первый раз: одно действие</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="processing" size="1/2" heading="Каталог готовится" text="Загружаем 1 240 товаров из файла. Это займёт пару минут."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Готовится: данные скоро будут</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="nothing-found" size="1/2" heading="Ничего не нашлось" text="Уберите условие фильтра или измените запрос."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Ничего не нашлось: что изменить</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="offline" size="1/2" heading="Нет связи" text="Проверьте интернет — список загрузится сам."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Нет связи: что проверить</span>
    </div>
  </div>
</div>
