<div class="grid grid-col-1 cq-md:grid-col-2 gap-3 query-container">
  <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — главная первой, «Отмена» тихая и последняя</span></figcaption>
    <div class="flex flex-1 flex-wrap gap-1/3 items-cross-center p-2">
      <sf-button text="Создать страницу"></sf-button>
      <sf-button appearance="ghost" scheme="on-surface" text="Отмена"></sf-button>
    </div>
  </figure>
  <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden" data-spacing-gate="off">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — «ОК» не говорит, что будет, «Отмена» спорит с главной</span></figcaption>
    <div class="flex flex-1 flex-wrap gap-1/3 items-cross-center p-2">
      <sf-button appearance="outline" scheme="on-surface" text="Отмена"></sf-button>
      <sf-button text="ОК"></sf-button>
    </div>
  </figure>
</div>
