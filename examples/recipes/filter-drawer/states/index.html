<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3 items-cross-center"><sf-button appearance="tonal" scheme="primary" icon-start="filter_list" text="Фильтры · 2"></sf-button><sf-tag text="Оплачен" closable></sf-tag><sf-tag text="Курьером" closable></sf-tag><sf-button appearance="ghost" scheme="on-surface" text="Сбросить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Фильтр включён: число условий и метки</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="nothing-found" size="1/2" heading="Заказов нет" text="По этим фильтрам заказов нет. Уберите условие."><sf-button slot="actions" appearance="outline" scheme="on-surface" text="Сбросить фильтры"></sf-button></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Ничего не нашлось: сбросить фильтры</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3"><sf-button text="Показать заказы" loading></sf-button><sf-button appearance="ghost" scheme="on-surface" text="Сбросить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Применяется: кнопка занята</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3"><sf-button text="Показать 12 заказов"></sf-button><sf-button appearance="ghost" scheme="on-surface" text="Сбросить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Число результатов на кнопке</span>
    </div>
  </div>
</div>
