<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="sf-tile-metric-grid"><sf-tile-metric label="Заказы" loading></sf-tile-metric><sf-tile-metric label="Выручка" loading></sf-tile-metric></div>
      <span class="text-1/2 color-on-surface-variant">Загрузка: плитки держат место</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="sf-tile-metric-grid"><sf-tile-metric label="Заказы" value="0" format="integer" period-text="за неделю"></sf-tile-metric></div>
      <span class="text-1/2 color-on-surface-variant">Нет данных: ноль, а не пустота</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-list-attention label="Требует внимания">
        <script type="application/json" data-sf-settings>{"items": []}</script>
      </sf-list-attention>
      <span class="text-1/2 color-on-surface-variant">Всё в порядке: внимание не нужно</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert status="error" heading="Сводка не загрузилась" supporting-text="Плитки покажут данные, когда сервер ответит." action-text="Повторить" action="retry"></sf-alert>
      <span class="text-1/2 color-on-surface-variant">Ошибка: одна на весь экран</span>
    </div>
  </div>
</div>
