<div class="flex flex-col gap-2">
  <div class="flex"><sf-segmented id="table-state" size="1/2" aria-label="Состояние списка" value="ready"
    items='[{"value":"ready","label":"Записи"},{"value":"filtered","label":"Фильтр: 2"},{"value":"nothing","label":"Ничего"},{"value":"loading","label":"Загрузка"},{"value":"error","label":"Ошибка"}]'></sf-segmented></div>
  <div class="flex flex-wrap items-cross-center gap-1">
    <div class="grow min-w-0 max-w-g6">
      <sf-input id="search" appearance="filled" icon-start="search" input-type="search" clearable placeholder="Найти по названию или артикулу" aria-label="Поиск по товарам"></sf-input>
    </div>
    <div class="flex flex-wrap items-cross-center gap-1/3">
      <sf-settings id="filter" look="panel" apply="button" label="Фильтр">
        <sf-button id="filter-button" appearance="outline" scheme="on-surface" icon-start="filter_list" text="Фильтр"></sf-button>
      </sf-settings>
      <sf-settings id="columns" look="panel" search label="Колонки и вид списка">
        <sf-button-icon icon="view_column" appearance="outline" scheme="on-surface" aria-label="Колонки и вид списка"></sf-button-icon>
      </sf-settings>
      <sf-button id="views" appearance="outline" scheme="on-surface" icon-end="arrow_drop_down" text="Все товары"></sf-button>
    </div>
    <div class="flex flex-wrap items-cross-center gap-1/3 m-inline-start-auto">
      <sf-segmented id="layout" aria-label="Вид списка" value="table"
        items='[{"value":"table","label":"Таблица","icon":"table_rows"},{"value":"list","label":"Список","icon":"view_agenda"}]'></sf-segmented>
      <sf-button id="add" icon-start="add" text="Добавить товар" split
        menu='[{"id":"section","text":"Добавить раздел","icon":"create_new_folder"},{"id":"import","text":"Загрузить из файла","icon":"upload_file"}]'></sf-button>
    </div>
  </div>
  <sf-view-table id="goods" toolbar="false" layout="table" layout-switch="false" size="1" row-actions-visible="hover" quick-actions="edit,view,delete" aria-label="Товары"></sf-view-table>
</div>
