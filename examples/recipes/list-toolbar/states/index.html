<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="first-use" size="1/2" heading="Товаров пока нет" text="Добавьте первый товар или загрузите каталог из файла."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Записей ещё нет: панель без фильтра и колонок — искать нечего</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="nothing-found" size="1/2" heading="Ничего не нашлось" text="По запросу «пуэр 2007» и двум условиям фильтра записей нет."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Ничего не нашлось: что не нашлось и что сделать</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap items-cross-center gap-1/3">
        <sf-button appearance="tonal" scheme="primary" icon-start="filter_list" text="Фильтр · 2"></sf-button>
        <sf-button appearance="ghost" scheme="on-surface" text="Сбросить"></sf-button>
      </div>
      <span class="text-1/2 color-on-surface-variant">Фильтр включён: число условий в подписи кнопки</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex"><sf-button id="many-views" appearance="outline" scheme="on-surface" icon-end="arrow_drop_down" text="Все товары"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Много видов: больше семи — в меню появляется поиск, «Все товары» всегда первым</span>
    </div>
  </div>
</div>
