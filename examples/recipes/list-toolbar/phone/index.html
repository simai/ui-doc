  <div class="flex items-cross-center gap-1/3">
    <sf-button-icon icon="filter_list" appearance="outline" scheme="on-surface" aria-label="Фильтр"></sf-button-icon>
    <sf-button-icon icon="view_column" appearance="outline" scheme="on-surface" aria-label="Колонки"></sf-button-icon>
