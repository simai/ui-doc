<div class="grid grid-col-1 cq-md:grid-col-2 gap-3 query-container">
  <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — одна главная кнопка, вторая с рамкой</span></figcaption>
    <div class="flex flex-1 flex-wrap justify-center gap-1/3 p-2"><sf-button text="Начать" icon-end="arrow_forward"></sf-button><sf-button text="Документация" appearance="outline"></sf-button></div>
  </figure>
  <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — три залитые кнопки спорят, какая главная</span></figcaption>
    <div class="flex flex-1 flex-wrap justify-center gap-1/3 p-2"><sf-button text="Начать"></sf-button><sf-button text="Документация"></sf-button><sf-button text="Цены"></sf-button></div>
  </figure>
</div>
