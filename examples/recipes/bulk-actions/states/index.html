<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap items-cross-center gap-1">
        <div class="flex items-cross-center gap-1/3"><span class="weight-5">Выбрано 3</span><sf-button appearance="ghost" scheme="on-surface" text="Снять выбор"></sf-button></div>
        <div class="flex flex-wrap gap-1/3">
          <sf-button appearance="outline" scheme="on-surface" text="Опубликовать"></sf-button>
          <sf-button appearance="outline" scheme="on-surface" status="danger" icon-start="delete" text="Удалить"></sf-button>
        </div>
      </div>
      <span class="text-1/2 color-on-surface-variant">Выбрано N: строка на месте панели, опасное — последним, с рамкой</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-confirm status="danger" destructive appearance="card" size="1/2" question="Удалить 3 новости?" consequence="Они пропадут с сайта и из поиска. Вернуть можно в течение 30 дней из корзины." accept-text="Удалить 3 новости" decline-text="Отмена"></sf-confirm>
      <span class="text-1/2 color-on-surface-variant">Вопрос: что удалится и можно ли вернуть</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-toast status="neutral" icon="delete" heading="Удалено 3 новости" action-text="Отменить" action="undo" closable duration="0"></sf-toast>
      <span class="text-1/2 color-on-surface-variant">После удаления: «Отменить»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-toast status="warning" heading="Удалено 2 из 3" supporting-text="«График работы в праздники» закреплён на главной — снимите закрепление." action-text="Открыть" action="open" closable duration="0"></sf-toast>
      <span class="text-1/2 color-on-surface-variant">Часть не удалилась: что и почему</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex items-cross-center gap-1/2 p-1/2 radius-surface border border-outline-variant">
        <sf-checkbox aria-label="Выбрать письмо «Счёт № 118 за ноябрь»"></sf-checkbox>
        <span class="grow min-w-0">Анна Котова — Счёт № 118 за ноябрь</span>
        <div class="flex gap-1/3">
          <sf-button-icon icon="archive" appearance="ghost" scheme="on-surface" aria-label="В архив"></sf-button-icon>
          <sf-button-icon icon="mark_email_unread" appearance="ghost" scheme="on-surface" aria-label="Пометить непрочитанным"></sf-button-icon>
          <sf-button-icon icon="more_horiz" appearance="ghost" scheme="on-surface" aria-label="Ещё действия"></sf-button-icon>
        </div>
      </div>
      <span class="text-1/2 color-on-surface-variant">Действия у строки письма: до трёх значков и «⋯»; удаление письма — в «⋯», без вопроса</span>
    </div>
  </div>
</div>
