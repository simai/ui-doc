<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-2">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-cross-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — скелет на месте строк, форма раздела видна сразу</span></figcaption>
      <div class="grow p-2"><sf-list loading label="Новости" size="1/2"></sf-list></div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-cross-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — спиннер на весь раздел: формы нет, потом всё прыгает</span></figcaption>
      <div class="grow p-2 flex items-cross-center content-main-center"><sf-spinner size="2" label="Загрузка"></sf-spinner></div>
    </figure>
  </div>
</div>
