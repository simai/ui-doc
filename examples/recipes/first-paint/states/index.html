<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-list loading label="Новости" size="1"></sf-list>
      <span class="text-1/2 color-on-surface-variant">Первый кадр: список сам в загрузке</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="first-use" size="1/2" heading="Новостей пока нет" text="Первая новость появится на сайте сразу после публикации."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Пусто</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="error" size="1/2" heading="Не удалось загрузить новости" text="Сервер не ответил за 30 секунд."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Ошибка</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-list id="state-more" has-more label="Новости" size="1/2"></sf-list>
      <span class="text-1/2 color-on-surface-variant">Много: «Показать ещё», скелет строк на месте следующей порции</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3">
        <sf-button loading appearance="outline" scheme="on-surface" icon-start="refresh" text="Обновить"></sf-button>
        <sf-button loading text="Сохранить"></sf-button>
      </div>
      <span class="text-1/2 color-on-surface-variant">Кнопка в работе: дуга в цвет кнопки</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex items-cross-center gap-1/2">
        <sf-spinner size="1/2" label="Готовим файл"></sf-spinner>
        <span class="text-1/2 color-on-surface-variant">Готовим файл…</span>
      </div>
      <span class="text-1/2 color-on-surface-variant">Малое место без формы: спиннер с подписью</span>
    </div>
  </div>
</div>
