<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="no-data" size="1/2" heading="Новых уведомлений нет" text="Здесь появятся события сайтов и сервера."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">Пусто: нет причины — нет сообщения; в центре — пустое состояние</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3"><sf-button loading text="Сохранить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Ожидание: работает кнопка, а не всплывающее «Сохраняем…»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert status="error" heading="Не удалось загрузить заказы" supporting-text="Сервер не ответил. Данные на странице — на 14:20." action-text="Повторить" action="retry"></sf-alert>
      <span class="text-1/2 color-on-surface-variant">Ошибка страницы: уведомление с «Повторить»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-toast status="error" heading="Письмо не отправлено" supporting-text="Адрес ivanova@ не похож на почту." action-text="Исправить" closable duration="0"></sf-toast>
      <span class="text-1/2 color-on-surface-variant">Ошибка ответа на действие: до крестика</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-toast status="success" heading="Запись сохранена" action-text="Отменить" action="undo" closable duration="0"></sf-toast>
      <span class="text-1/2 color-on-surface-variant">Успех: уходит сам через 5 секунд</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex flex-wrap gap-1/3"><sf-button id="many" appearance="outline" scheme="on-surface" text="Пять ответов подряд"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Много: видно четыре, повтор не множится, а считается</span>
    </div>
  </div>
</div>
