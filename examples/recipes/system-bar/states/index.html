<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert-bar id="st-error" size="1/2" label="Важные уведомления"></sf-alert-bar>
      <span class="text-1/2 color-on-surface-variant">Ошибка: закрыть нельзя, только свернуть</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert-bar id="st-warning" size="1/2" label="Важные уведомления"></sf-alert-bar>
      <span class="text-1/2 color-on-surface-variant">Предупреждение: действие и «Прочитано»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert-bar id="st-many" size="1/2" label="Важные уведомления"></sf-alert-bar>
      <span class="text-1/2 color-on-surface-variant">Много: видно самое серьёзное, остальное — в «Ещё 2»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert-bar id="st-site" size="1" label="Важные уведомления"></sf-alert-bar>
      <span class="text-1/2 color-on-surface-variant">Сайт клиента: <code>size="1"</code>, текст по колонке страницы</span>
    </div>
  </div>
</div>
