<div class="query-container" data-sf-density="compact">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — «Отмена» тихая, она ничего не ломает</span></figcaption>
      <div class="flex flex-1 flex-wrap gap-2 items-cross-center p-2">
        <sf-button text="Сохранить"></sf-button>
        <sf-button appearance="ghost" scheme="on-surface" text="Отмена"></sf-button>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — красный значит «удалит», а не «закроет»</span></figcaption>
      <div class="flex flex-1 flex-wrap gap-2 items-cross-center p-2">
        <sf-button text="Сохранить"></sf-button>
        <sf-button status="danger" text="Отмена"></sf-button>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — ошибка под полем и что сделать</span></figcaption>
      <div class="flex-1 flex flex-col gap-2 p-2">
        <sf-input label="Название сайта" required invalid error-message="Введите название: его видно во вкладке браузера"></sf-input>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — общая ошибка сверху, поле не отмечено</span></figcaption>
      <div class="flex-1 flex flex-col gap-2 p-2">
        <sf-alert status="error" title="Форма заполнена с ошибками"></sf-alert>
        <sf-input label="Название сайта" required></sf-input>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — подпись над полем, в поле — образец</span></figcaption>
      <div class="flex-1 flex flex-col gap-2 p-2">
        <sf-input label="Адрес" placeholder="https://example.ru"></sf-input>
      </div>
    </figure>
    <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
      <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — подпись в поле пропадает при вводе</span></figcaption>
      <div class="flex-1 flex flex-col gap-2 p-2">
        <sf-input placeholder="Адрес сайта" aria-label="Адрес сайта"></sf-input>
      </div>
    </figure>
  </div>
</div>
