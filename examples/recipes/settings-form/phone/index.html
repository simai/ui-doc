<form class="flex flex-col gap-2" data-sf-density="compact" novalidate>
  <section class="sf-card" aria-labelledby="phone-main">
    <h2 id="phone-main" class="m-0 text-1 weight-medium">Основное</h2>
    <sf-input name="name" label="Название сайта" default-value="Магазин «Северный ветер»"></sf-input>
    <sf-input name="domain" label="Адрес" input-type="url" default-value="https://nord-wind.ru"></sf-input>
    <sf-switch name="index" label="Показывать в поисковых системах" checked></sf-switch>
  </section>
  <div class="flex gap-1/3"><sf-button text="Сохранить"></sf-button><sf-button appearance="ghost" scheme="on-surface" text="Отмена"></sf-button></div>
</form>
