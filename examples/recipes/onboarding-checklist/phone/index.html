<section class="sf-card flex flex-col gap-1" data-sf-density="compact" aria-labelledby="phone-start-title">
  <div class="flex justify-between items-cross-baseline gap-1">
    <h3 id="phone-start-title" class="m-0 text-1 weight-6">Первые шаги</h3>
    <span class="text-1/2 color-on-surface-variant" aria-hidden="true">3 из 5</span>
  </div>
  <p class="m-0 text-1/2 color-on-surface-variant">Сайт заработает, когда сделаете эти пять дел.</p>
  <sf-progress-bar value="60" label="Первые шаги" value-text="3 из 5 задач"></sf-progress-bar>
  <sf-list id="phone-start" label="Задачи для начала"></sf-list>
  <div class="flex justify-end"><sf-button appearance="ghost" scheme="on-surface" text="Скрыть список"></sf-button></div>
</section>
