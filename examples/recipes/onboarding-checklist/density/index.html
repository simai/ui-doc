<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <section class="sf-card flex flex-col gap-1" aria-label="Первые шаги, обычная плотность">
        <div class="flex content-main-between items-cross-baseline gap-1"><h4 class="m-0 text-1 weight-medium">Первые шаги</h4><span class="text-1/2 color-on-surface-variant" aria-hidden="true">1 из 3</span></div>
        <sf-progress-bar value="33" label="Первые шаги" value-text="1 из 3 задач"></sf-progress-bar>
        <sf-list data-demo="density-start" label="Задачи для начала"></sf-list>
      </section>
      <span class="text-1/2 color-on-surface-variant">обычная</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0" data-sf-density="compact">
      <section class="sf-card flex flex-col gap-1" aria-label="Первые шаги, компактная плотность">
        <div class="flex content-main-between items-cross-baseline gap-1"><h4 class="m-0 text-1 weight-medium">Первые шаги</h4><span class="text-1/2 color-on-surface-variant" aria-hidden="true">1 из 3</span></div>
        <sf-progress-bar value="33" label="Первые шаги" value-text="1 из 3 задач"></sf-progress-bar>
        <sf-list data-demo="density-start" label="Задачи для начала"></sf-list>
      </section>
      <span class="text-1/2 color-on-surface-variant">компактная</span>
    </div>
  </div>
</div>
