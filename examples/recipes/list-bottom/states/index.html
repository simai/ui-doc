<div class="grid grid-col-1 cq-md:grid-col-2 gap-2 query-container" data-sf-density="compact">
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-empty-state kind="nothing-found" size="1/2" heading="Заказов с такими условиями нет" text="Измените фильтр или сбросьте его."></sf-empty-state>
    <figcaption class="text-1/2 color-on-surface-variant">Пусто: низа нет, только пустое состояние</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <div class="list-foot"><span class="list-range">1–7 из 7</span></div>
    <figcaption class="text-1/2 color-on-surface-variant">Одна страница: только диапазон, переход не нужен</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-list label="Письма" size="1/2" loading></sf-list>
    <div class="list-foot is-center"><sf-pagination appearance="more" total="240" page-size="20" current="1" show-more-busy></sf-pagination></div>
    <figcaption class="text-1/2 color-on-surface-variant">Загрузка: «Показать ещё» ждёт ответа, строки — заготовка</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <div class="flex flex-wrap items-cross-center content-main-center gap-1/3 text-1/2 color-on-surface-variant" role="alert"><span>Не удалось загрузить ещё 20 писем.</span><sf-button size="1/2" appearance="outline" scheme="on-surface" text="Повторить" icon-start="refresh"></sf-button></div>
    <figcaption class="text-1/2 color-on-surface-variant">Ошибка подгрузки: загруженное остаётся, «Повторить» на месте кнопки</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <sf-pagination appearance="field" size="1/2" total="240" page-size="20" current="1"></sf-pagination>
    <sf-pagination appearance="field" size="1/2" total="240" page-size="20" current="12"></sf-pagination>
    <figcaption class="text-1/2 color-on-surface-variant">Первая и последняя страница: кнопки на краях гаснут, ряд той же ширины</figcaption>
  </figure>
  <figure class="m-0 flex flex-col gap-1/2">
    <div class="list-foot"><span class="list-range">41–60 из ~12 000</span><div class="list-nav"><sf-pagination appearance="field" size="1/2" total="12000" total-exact="false" can-count page-size="20" current="3"></sf-pagination></div></div>
    <figcaption class="text-1/2 color-on-surface-variant">Очень много: число — оценка «~12 000», точное — по просьбе</figcaption>
  </figure>
</div>
