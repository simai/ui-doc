<div class="grid grid-col-1 cq-md:grid-col-2 gap-3 query-container" data-sf-density="compact">
  <figure class="m-0 flex flex-col radius-surface border border-success overflow-hidden">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-success-container color-on-success-container"><i class="sf-icon" aria-hidden="true">check_circle</i><span><b>Правильно</b> — «Показать ещё» отдельно, по центру</span></figcaption>
    <div class="flex flex-1 content-main-center p-2"><sf-pagination appearance="more" total="240" page-size="20" current="1"></sf-pagination></div>
  </figure>
  <figure class="m-0 flex flex-col radius-surface border border-error overflow-hidden">
    <figcaption class="flex items-start gap-1/3 p-x-1 p-y-1/2 text-1/2 bg-error-container color-on-error-container"><i class="sf-icon" aria-hidden="true">cancel</i><span><b>Неправильно</b> — «Показать ещё» и номера в одной строке спорят друг с другом</span></figcaption>
    <div class="flex flex-1 flex-wrap items-cross-center gap-1 p-2"><sf-pagination appearance="more" total="240" page-size="20" current="1"></sf-pagination><sf-pagination appearance="numbers" size="1/2" total="240" page-size="20" current="1"></sf-pagination></div>
  </figure>
</div>
