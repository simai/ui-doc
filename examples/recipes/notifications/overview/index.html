<div id="notify-root" data-sf-density="compact">
  <div class="flex items-cross-center gap-2 p-x-2 p-y-1 radius-surface border border-outline-variant">
    <span class="flex-1 weight-6">Магазин «Северный ветер»</span>
    <sf-avatar text="АБ" size="1/2" aria-label="Анна Белова"></sf-avatar>
    <sf-popover id="notify-popover" label="Уведомления" placement="bottom-end" width="min(var(--sf-g4), calc(100vw - var(--sf-space-4)))" open>
      <sf-button-icon slot="trigger" id="notify-bell" icon="notifications" appearance="ghost" scheme="on-surface" badge-count="3" badge-label="3 непрочитанных" aria-label="Уведомления"></sf-button-icon>
      <div slot="content" class="flex flex-col">
        <div class="flex items-cross-center gap-2 p-x-2 p-top-2 p-bottom-1">
          <h2 class="flex-1 m-0 text-1 weight-6">Уведомления</h2>
          <sf-button id="notify-read-all" appearance="ghost" scheme="on-surface" size="1/2" text="Прочитать все"></sf-button>
        </div>
        <div class="p-x-2 p-bottom-1">
          <sf-segmented id="notify-filter" size="1/2" full-width aria-label="Какие уведомления показать" value="all" items='[{"value":"all","label":"Все"},{"value":"unread","label":"Непрочитанные","count":3}]'></sf-segmented>
        </div>
        <div class="max-h-g4 overflow-auto p-x-1 p-bottom-1">
          <sf-list id="notify-list" label="Уведомления" group-by="day" heading-level="3" size="1/2" empty-text="Непрочитанных нет"></sf-list>
        </div>
      </div>
    </sf-popover>
  </div>
</div>
