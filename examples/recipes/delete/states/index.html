<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-toast status="neutral" icon="delete" title="Фильтр «Мои черновики» удалён" action-text="Вернуть" action="undo" closable="false"></sf-toast>
      <span class="text-1/2 color-on-surface-variant">Своё и восстановимое: сразу, с «Вернуть»</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <div class="flex gap-1/3"><sf-button status="danger" text="Удалить" loading></sf-button><sf-button appearance="ghost" scheme="on-surface" text="Отмена" disabled></sf-button></div>
      <span class="text-1/2 color-on-surface-variant">Удаляется: кнопка занята</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-alert status="error" heading="Не удалось удалить" supporting-text="Файл открыт у другого участника. Попробуйте позже." action-text="Повторить" action="retry"></sf-alert>
      <span class="text-1/2 color-on-surface-variant">Не удалось: почему и что сделать</span>
    </div>
    <div class="flex flex-col gap-1/2 min-w-0">
      <sf-empty-state kind="no-data" size="1/2" heading="Корзина пуста" text="Удалённые файлы хранятся здесь 30 дней."></sf-empty-state>
      <span class="text-1/2 color-on-surface-variant">После удаления: место не пустует молча</span>
    </div>
  </div>
</div>
