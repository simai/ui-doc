<div class="query-container" data-sf-density="compact">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-3">
    <figure class="m-0 flex flex-col gap-1">
      <div class="flex-1 p-2 radius-surface border border-outline-variant"><sf-confirm question="Удалить «Смета на декабрь.xlsx»?" accept-text="Удалить" status="danger" size="1/2"></sf-confirm></div>
      <figcaption class="text-1/2 color-on-surface-variant"><b class="color-on-surface">Так</b> — вопрос называет, что удалится, «Удалить» красная</figcaption>
    </figure>
    <figure class="m-0 flex flex-col gap-1">
      <div class="flex-1 p-2 radius-surface border border-outline-variant"><sf-confirm question="Вы уверены?" size="1/2"></sf-confirm></div>
      <figcaption class="text-1/2 color-on-surface-variant"><b class="color-on-surface">Не так</b> — «Вы уверены?» и обычное «Подтвердить»</figcaption>
    </figure>
    <figure class="m-0 flex flex-col gap-1">
      <div class="flex-1 p-2 radius-surface border border-outline-variant"><sf-toast icon="delete" title="Фильтр «Крупные заказы» удалён" action-text="Вернуть" action="undo"></sf-toast></div>
      <figcaption class="text-1/2 color-on-surface-variant"><b class="color-on-surface">Так</b> — своё и обратимое: удалить сразу, дать «Вернуть»</figcaption>
    </figure>
    <figure class="m-0 flex flex-col gap-1">
      <div class="flex-1 p-2 radius-surface border border-outline-variant"><sf-confirm question="Удалить фильтр «Крупные заказы»?" accept-text="Удалить" status="danger" size="1/2"></sf-confirm></div>
      <figcaption class="text-1/2 color-on-surface-variant"><b class="color-on-surface">Не так</b> — вопрос там, где можно просто вернуть</figcaption>
    </figure>
  </div>
</div>
