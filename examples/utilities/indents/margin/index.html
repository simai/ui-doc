<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">

    <div class="flex flex-col gap-1">

        <div class="weight-6 m-b-2">m-{n} (all sides)</div>

        <div class="demo m-0 bg-surface border border-outline-variant radius-2 p-3 grid gap-0">

            <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>

            <div class="sf-card bg-secondary color-on-secondary p-2 m-3" aria-label="m-3">m-3</div>

        </div>

    </div>

    <div class="flex flex-col gap-1">

        <div class="weight-6 m-b-2">inline / negative</div>

        <div class="demo m-0 bg-surface border border-outline-variant radius-2 p-3 flex items-center">

            <div class="grid grid-col-3 items-cross-center gap-y-1">

                <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>

                <div class="sf-card bg-tertiary color-on-tertiary p-2 m-inline-start-3"
                     aria-label="m-inline-start-3">m-inline-start-3
                </div>

                <div class="sf-card bg-success color-on-success p-2 -m-inline-start-2" aria-label="-m-inline-end-2">
                    -m-inline-start-2
                </div>

                <div class="sf-card bg-tertiary color-on-tertiary p-2 -m-inline-end-3"
                     aria-label="-m-inline-end-3">-m-inline-end-3
                </div>

                <div class="sf-card bg-success color-on-success p-2 m-inline-end-2" aria-label="m-inline-end-2">
                    m-inline-end-2
                </div>

                <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>

            </div>

        </div>

    </div>

    <div class="flex flex-col gap-1">

        <div class="weight-6 m-b-2">vertical / negative</div>

        <div class="demo m-0 bg-surface border border-outline-variant radius-2 p-3 flex items-center">

            <div class="grid grid-col-1">

                <div class="sf-card bg-primary color-on-primary p-2 m-bottom-1" aria-label="m-bottom-1">
                    m-bottom-1
                </div>

                <div class="sf-card bg-secondary color-on-secondary p-2 -m-bottom-1" aria-label="-m-bottom-1">
                    -m-bottom-1
                </div>

                <div class="sf-card bg-tertiary color-on-tertiary p-2 m-0" aria-label="m-0">m-0</div>

                <div class="sf-card bg-warning color-on-warning p-2 m-top-1" aria-label="m-top-1">m-top-1</div>

                <div class="sf-card bg-success color-on-success p-2 -m-top-1" aria-label="-m-top-1">-m-top-1
                </div>

            </div>

        </div>

    </div>

    <div class="flex flex-col gap-1">

        <div class="weight-6 m-b-2">combo x/y</div>

        <div class="demo m-0 bg-surface border border-outline-variant radius-2 p-3 flex items-center">

            <div class="grid grid-col-1">
                <div class="grid grid-col-3 m-bottom-1">
                    <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>
                    <div class="sf-card bg-primary color-on-primary p-2 m-inline-1" aria-label="m-inline-1">
                        m-inline-1
                    </div>
                    <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>
                </div>

                <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>

                <div class="sf-card bg-tertiary color-on-tertiary p-2 m-block-4" aria-label="m-block-4">m-block-4</div>

                <div class="sf-card bg-primary color-on-primary p-2 m-0" aria-label="m-0">m-0</div>
            </div>

        </div>

    </div>

</div>

</div>
