<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-bottom-2 text-center">space-x-{n}</div>
    <div class="m-0 bg-surface border border-outline-variant radius-3 p-3 flex space-x-3">
      <div class="bg-primary color-on-primary p-2" aria-label="A">A</div>
      <div class="bg-secondary color-on-secondary p-2" aria-label="B">B</div>
      <div class="bg-tertiary color-on-tertiary p-2" aria-label="C">C</div>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-bottom-2 text-center">space-x-{n} + reverse</div>
    <div class="m-0 bg-surface border border-outline-variant radius-3 p-3 flex flex-row-reverse space-x-3 space-x-reverse">
      <div class="bg-primary color-on-primary p-2" aria-label="A">A</div>
      <div class="bg-secondary color-on-secondary p-2" aria-label="B">B</div>
      <div class="bg-tertiary color-on-tertiary p-2" aria-label="C">C</div>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-bottom-2 text-center">space-y-{n}</div>
    <div class="m-0 bg-surface border border-outline-variant radius-3 p-3 flex flex-col space-y-2">
      <div class="bg-primary color-on-primary p-2" aria-label="1">1</div>
      <div class="bg-secondary color-on-secondary p-2" aria-label="2">2</div>
      <div class="bg-tertiary color-on-tertiary p-2" aria-label="3">3</div>
    </div>
  </div>
    <div class="flex flex-col gap-1">
    <div class="weight-6 m-bottom-2 text-center">space-y-{n} + reverse</div>
    <div class="m-0 bg-surface border border-outline-variant radius-3 p-3 flex flex-col-reverse space-y-2 space-y-reverse">
      <div class="bg-primary color-on-primary p-2" aria-label="1">1</div>
      <div class="bg-secondary color-on-secondary p-2" aria-label="2">2</div>
      <div class="bg-tertiary color-on-tertiary p-2" aria-label="3">3</div>
    </div>
  </div>
</div>
