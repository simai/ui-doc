<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">scroll-mt-6</div>
    <div class="flex gap-2 m-b-2">
      <button
        type="button"
        class="p-2 radius-1 border border-outline-variant bg-surface-0 color-on-surface js-scroll-target"
        data-target="target-mt"
        data-block="start">
        Scroll start
      </button>
      <button
        type="button"
        class="p-2 radius-1 border border-outline-variant bg-surface-0 color-on-surface js-scroll-target"
        data-target="target-mt"
        data-block="end">
        Scroll end
      </button>
    </div>
    <div class="sf-card p-2 radius-2 border border-outline-variant h-f6 overflow-auto">
      <div class="h-f9 bg-surface-container radius-1 p-2">
        <div class="p-2 m-b-2 radius-1 bg-surface">Top spacer</div>
        <div class="h-f4 m-b-2 bg-surface"></div>
        <div id="target-mt" class="scroll-mt-6 p-2 bg-primary-container color-on-primary-container radius-1">
          target + scroll-mt-6
        </div>
        <div class="h-f4 m-t-2 bg-surface"></div>
        <div class="p-2 radius-1 bg-surface">Bottom spacer</div>
      </div>
    </div>
    <div class="m-t-2 text-size-2 color-on-surface-variant">Affects only top alignment.</div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">scroll-my-4</div>
    <div class="flex gap-2 m-b-2">
      <button
        type="button"
        class="p-2 radius-1 border border-outline-variant bg-surface-0 color-on-surface js-scroll-target"
        data-target="target-my"
        data-block="start">
        Scroll start
      </button>
      <button
        type="button"
        class="p-2 radius-1 border border-outline-variant bg-surface-0 color-on-surface js-scroll-target"
        data-target="target-my"
        data-block="end">
        Scroll end
      </button>
    </div>
    <div class="sf-card p-2 radius-2 border border-outline-variant h-f6 overflow-auto">
      <div class="h-f9 bg-surface-container radius-1 p-2">
        <div class="p-2 m-b-2 radius-1 bg-surface">Top spacer</div>
        <div class="h-f4 m-b-2 bg-surface"></div>
        <div id="target-my" class="scroll-my-4 p-2 bg-secondary-container color-on-secondary-container radius-1">
          target + scroll-my-4
        </div>
        <div class="h-f4 m-t-2 bg-surface"></div>
        <div class="p-2 radius-1 bg-surface">Bottom spacer</div>
      </div>
    </div>
    <div class="m-t-2 text-size-2 color-on-surface-variant">Affects both start and end alignment.</div>
  </div>
</div>
