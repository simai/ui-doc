<div class="grid grid-col-1 sm:grid-col-2 gap-4 color-on-surface">
  <div class="flex flex-col gap-1">
    <code class="text-1/2 color-on-surface-variant">print-block</code>
    <div class="p-1 border border-dashed border-outline radius-ui">
      <span class="print-hidden color-on-surface-variant">На экране блок скрыт</span>
      <div class="print-block p-1 bg-primary-container color-on-primary-container radius-ui">Блок только для печати</div>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <code class="text-1/2 color-on-surface-variant">print-inline</code>
    <div class="p-1 border border-dashed border-outline radius-ui">

    </div>
  </div>
  <div class="flex flex-col gap-1">
    <code class="text-1/2 color-on-surface-variant">print-flex</code>

      <div class="print-flex gap-1">

      </div>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <code class="text-1/2 color-on-surface-variant">print-table</code>
    <div class="p-1 border border-dashed border-outline radius-ui">
      <span class="print-hidden color-on-surface-variant">На экране таблица скрыта</span>
      <div class="print-table">
        <div class="table-row">
          <span class="table-cell p-1">Итого</span>
          <span class="table-cell p-1 weight-6">1 200 ₽</span>
        </div>
      </div>
    </div>
  </div>
