<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">divider-primary / secondary / tertiary</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-primary m-b-2">
      <div class="p-2 bg-surface-container color-on-primary-container">primary</div>
      <div class="p-2 bg-surface-container color-on-primary-container">primary</div>
      <div class="p-2 bg-surface-container color-on-primary-container">primary</div>
    </div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-secondary m-b-2">
      <div class="p-2 bg-surface-container color-on-secondary-container">secondary</div>
      <div class="p-2 bg-surface-container color-on-secondary-container">secondary</div>
      <div class="p-2 bg-surface-container color-on-secondary-container">secondary</div>
    </div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-tertiary">
      <div class="p-2 bg-surface-container color-on-tertiary-container">tertiary</div>
      <div class="p-2 bg-surface-container color-on-tertiary-container">tertiary</div>
      <div class="p-2 bg-surface-container color-on-tertiary-container">tertiary</div>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">divider-success / warning / error + hover</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-success hover:divider-error m-b-2">
      <div class="p-2 bg-surface-container color-on-success-container transition">success</div>
      <div class="p-2 bg-surface-container color-on-success-container transition">success</div>
      <div class="p-2 bg-surface-container color-on-success-container transition">success</div>
    </div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-warning hover:divider-primary m-b-2 m-b-2">
      <div class="p-2 bg-surface-container color-on-warning-container">warning</div>
      <div class="p-2 bg-surface-container color-on-warning-container">warning</div>
      <div class="p-2 bg-surface-container color-on-warning-container">warning</div>
    </div>
    <div class="sf-card p-3 radius-2 border border-outline-variant divider-y-2 divider-outline">
      <div class="p-2 bg-surface-container">outline</div>
      <div class="p-2 bg-surface-container">outline</div>
      <div class="p-2 bg-surface-container">outline</div>
    </div>
  </div>
</div>
