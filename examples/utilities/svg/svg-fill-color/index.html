<div class="wrap grid grid-col-1 sm:grid-col-3 max-w-md gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">fill-primary</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant content-main-center gap-2">
      <svg class="svg-6 fill-primary" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">fill-warning</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant content-main-center gap-2">
      <svg class="svg-6 fill-warning" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">hover:fill-success</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant content-main-center gap-2">
      <svg class="svg-6 transition fill-error hover:fill-success" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
    </div>
  </div>
</div>
