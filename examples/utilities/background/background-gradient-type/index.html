<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <div
    class="sf-card radius-2 p-3 h-e5 gr-line-2 color-on-surface"
    style="--sf-gradient--angle: 90deg; --sf-gradient--color-1: var(--sf-primary); --sf-gradient--color-2: var(--sf-primary-container);"
  >
    <div>gr-line-2</div>
    <p>Colors set via CSS vars (angle 90°).</p>
  </div>

  <div
    class="sf-card radius-2 p-3 h-e5 gr-line-3 color-on-surface"
    style="--sf-gradient--angle: 45deg; --sf-gradient--color-1: var(--sf-primary); --sf-gradient--color-2: var(--sf-secondary); --sf-gradient--color-3: var(--sf-tertiary);"
  >
    <div>gr-line-3 (45°)</div>
    <p>Three stops set inline; custom angle.</p>
  </div>

  <div
    class="sf-card radius-2 p-3 h-e5 gr-radial-3 color-on-surface"
    style="--sf-gradient--color-1: var(--sf-surface-0); --sf-gradient--color-2: var(--sf-transparent); --sf-gradient--color-3: var(--sf-primary);"
  >
    <div>gr-radial-3</div>
    <p>Radial with inline color stops.</p>
  </div>

  <div
    class="sf-card radius-2 p-3 h-e5 gr-conic-2 color-on-surface"
    style="--sf-gradient--angle: 0deg; --sf-gradient--color-1: var(--sf-primary-container); --sf-gradient--color-2: var(--sf-primary);"
  >
    <div>gr-conic-2</div>
    <p>Conic; angle optional.</p>
  </div>
</div>
