<div class="wrap grid grid-col-1 sm:grid-col-3 max-w-xl gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">shadow-primary</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant shadow-1 shadow-primary">
      <p class="m-b-0 color-on-surface">Primary colored shadow.</p>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">shadow-success</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant shadow-3 shadow-success">
      <p class="m-b-0 color-on-surface">Success colored shadow.</p>
    </div>
  </div>

  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">hover:shadow-error</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant shadow-5 shadow-warning hover:shadow-secondary transition">
      <p class="m-b-0 color-on-surface">Hover changes shadow color.</p>
    </div>
  </div>
