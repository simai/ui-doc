<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 justify-start">
  <div class="sf-card p-3 flex flex-col gap-1 radius-3 border border-outline-variant">
    <div class="weight-6 m-b-2 text-center">base translate</div>
    <div class="grid grid-col-3 gap-2 bg-surface-container radius-2 p-2">
      <div class="p-1 bg-primary-container color-on-primary-container radius-1 text-center translate-x-6">x+6</div>
      <div class="p-1 bg-secondary-container color-on-secondary-container radius-1 text-center -translate-x-4">x-4</div>
      <div class="p-1 bg-tertiary-container color-on-tertiary-container radius-1 text-center translate-y-6">y+6</div>
    </div>
  </div>

  <div class="sf-card p-3 flex flex-col gap-1 radius-3 border border-outline-variant">
    <div class="weight-6 m-b-2 text-center">half and ext range</div>
    <div class="grid grid-col-3 gap-2 bg-surface-container radius-2 p-2">
      <div class="p-1 bg-success-container color-on-success-container radius-1 text-center translate-x-half">x-half</div>
      <div class="p-1 bg-warning-container color-on-warning-container radius-1 text-center translate-x-c6">x-c6</div>
      <div class="p-1 bg-error-container color-on-error-container radius-1 text-center -translate-y-b2">y-b2</div>
    </div>
  </div>
