<div class="wrap grid grid-col-1 gap-3 content-main-start">
  <div class="sf-card p-3 flex flex-col gap-1 radius-2 border border-outline-variant">
    <div class="weight-6 m-b-2">scale presets</div>
    <div class="grid grid-col-2 sm:grid-col-4 gap-2 items-center">
      <div class="p-2 bg-primary-container color-on-primary-container radius-2 text-center scale-1 hover:scale-1/2 transition">1/2</div>
      <div class="p-2 bg-secondary-container color-on-secondary-container radius-2 text-center scale-1">1</div>
      <div class="p-2 bg-tertiary-container color-on-tertiary-container radius-2 text-center scale-2">2</div>
      <div class="p-2 bg-success-container color-on-success-container radius-2 text-center scale-4 hover:scale-1 transition">4</div>
    </div>
  </div>

  <div class="sf-card p-3 flex flex-col gap-1 radius-2 border border-outline-variant">
    <div class="weight-6 m-b-2">axis scale</div>
    <div class="grid grid-col-2 gap-2 items-center">
      <div class="p-2 bg-primary-container color-on-primary-container radius-2 text-center scale-x-4 hover:scale-x-1 transition">scale-x-4</div>
      <div class="p-2 bg-secondary-container color-on-secondary-container radius-2 text-center scale-y-4 hover:scale-y-1 transition">scale-y-4</div>
    </div>
  </div>
</div>
