<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
 <div class="flex flex-col gap-1">
    <div><b>ease-linear</b></div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1 transition-transform duration-slow ease-linear hover:translate-x-9">
        Linear motion
      </button>
    </div>
  </div>

 <div class="flex flex-col gap-1">
    <div><b>ease-in</b></div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1 transition-transform duration-slow ease-in hover:translate-x-9">
        Slow start
      </button>
    </div>
  </div>

 <div class="flex flex-col gap-1">
    <div><b>ease-out</b></div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1 transition-transform duration-slow ease-out hover:translate-x-9">
        Slow end
      </button>
    </div>
  </div>

 <div class="flex flex-col gap-1">
    <div><b>ease-in-out</b></div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button type="button" class="sf-button sf-button--outline sf-button--primary sf-button--size-1 transition-transform duration-slow ease-in-out hover:translate-x-9">
        Slow start and end
      </button>
    </div>
  </div>
</div>
