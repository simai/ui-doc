<div class="wrap grid grid-col-1 sm:grid-col-2 max-w-md gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">pointer-event-auto</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button
        type="button"
        class="pointer-event-auto p-2 radius-1 border border-outline-variant bg-primary color-on-primary"
      >
        Clickable button
      </button>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">pointer-event-none (card)</div>
    <div
      class="sf-card p-3 radius-2 border border-outline-variant pointer-event-none"
    >
      <button
        type="button"
        class="p-2 radius-1 border border-outline-variant bg-warning color-on-warning"
      >
        Click blocked by parent
      </button>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">pointer-event-none (element)</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <button
        type="button"
        class="pointer-event-none p-2 radius-1 border border-outline-variant bg-error color-on-error"
      >
        This element ignores pointer
      </button>
    </div>
  </div>
</div>
