<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <label class="sf-card p-3 radius-2 border border-outline-variant flex gap-2 items-center">
    <input type="checkbox" class="accent-primary" checked>
    <span>accent-primary</span>
  </label>

  <label class="sf-card p-3 radius-2 border border-outline-variant flex gap-2 items-center">
    <input type="checkbox" class="accent-success" checked>
    <span>accent-success</span>
  </label>

  <label class="sf-card p-3 radius-2 border border-outline-variant flex gap-2 items-center">
    <input type="radio" name="a" class="accent-warning" checked>
    <span>accent-warning (radio)</span>
  </label>

  <label class="sf-card p-3 radius-2 border border-outline-variant flex gap-2 items-center  hover:accent-error">
    <input type="checkbox" class="hover:accent-error" checked>
    <span>hover:accent-error</span>
  </label>
</div>
