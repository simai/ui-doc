<div class="wrap grid grid-col-1 sm:grid-col-2 gap-3 content-main-start">
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">placeholder-primary</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <input
        aria-label="placeholder-primary"
        class="w-full border border-outline-variant radius-1 p-2 placeholder-primary"
        placeholder="Primary placeholder"
      />
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">placeholder-warning</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <input
        aria-label="placeholder-warning"
        class="w-full border border-outline-variant radius-1 p-2 placeholder-warning"
        placeholder="Warning placeholder"
      />
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">hover:placeholder-success</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <input
        aria-label="hover placeholder success"
        class="w-full border border-outline-variant radius-1 p-2 placeholder-secondary hover:placeholder-success"
        placeholder="Hover me"
      />
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <div class="weight-6 m-b-2">focus:placeholder-error</div>
    <div class="sf-card p-3 radius-2 border border-outline-variant">
      <input
        aria-label="focus placeholder error"
        class="w-full border border-outline-variant radius-1 p-2 placeholder-tertiary focus:placeholder-error"
        placeholder="Focus me"
      />
    </div>
  </div>
</div>
