  <sf-input-rich name="article" label="Статья" rows="4" value="<h2>Как ухаживать за чугуном</h2><p>Чугунную сковороду моют без средства и сразу вытирают досуха.</p><p>После мытья смажьте её тонким слоем масла и прогрейте пять минут.</p><h3>Чего не делать</h3><ul><li>Не оставляйте в воде.</li><li>Не мойте в посудомоечной машине.</li><li>Не храните под крышкой.</li></ul><p>Если появилась ржавчина, снимите её жёсткой губкой и прокалите сковороду заново.</p><blockquote>Хорошая сковорода служит десятилетиями.</blockquote><p>Подробнее — в <a href=&quot;/guide/cast-iron/&quot;>памятке</a>.</p>"></sf-input-rich>
