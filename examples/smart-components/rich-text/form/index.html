<form id="rich-text-form" class="flex flex-col gap-3">
  <sf-rich-text label="Текст новости" name="body" required rows="4" placeholder="Напишите текст новости"></sf-rich-text>
  <div class="flex gap-2">
    <sf-button native-type="submit" text="Отправить"></sf-button>
  </div>
  <p id="rich-text-form-result" class="m-0 text-1/2 color-on-surface-variant" role="status">Форма не отправлялась.</p>
</form>
