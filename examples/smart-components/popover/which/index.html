<div class="flex flex-wrap items-cross-center gap-3">
  <span class="sf-tooltip-anchor">
    <button type="button" class="sf-icon-button sf-icon-button--icon sf-icon-button--ghost sf-icon-button--on-surface sf-icon-button--size-1" data-tooltip="which-copy-tip" aria-describedby="which-copy-tip" aria-label="Копировать ссылку"><i class="sf-icon" aria-hidden="true">content_copy</i></button>
    <span id="which-copy-tip" class="sf-tooltip sf-tooltip--dark sf-tooltip--size-1/3 sf-tooltip--arrow-top-center" hidden>
      <span class="sf-tooltip-content flex flex-col"><span class="sf-tooltip-wrap flex flex-col"><span class="sf-tooltip-text">Копировать ссылку</span></span><span class="sf-tooltip-tail" aria-hidden="true"></span></span>
    </span>
  </span>
  <div class="flex items-cross-center gap-1/3">
    <span class="text-1">Прерываемая ВМ</span>
    <sf-help-mark label="Подробнее: прерываемая ВМ" heading="Прерываемая ВМ" text="Машина дешевле обычной, но может быть остановлена в любой момент."></sf-help-mark>
  </div>
  <sf-popover label="Фильтр по статусу" placement="bottom-start">
    <sf-button slot="trigger" appearance="outline" scheme="on-surface" icon-start="filter_list" text="Статус"></sf-button>
    <div slot="content" class="flex flex-col gap-1 p-2">
      <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input type="checkbox" checked><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container"><span class="sf-checkbox-label">Открытые</span></span></label>
      <label class="sf-checkbox sf-checkbox--size-1 flex"><span class="sf-checkbox-box transition flex"><input type="checkbox"><span class="sf-icon" aria-hidden="true"></span></span><span class="sf-checkbox-container"><span class="sf-checkbox-label">Закрытые</span></span></label>
    </div>
  </sf-popover>
</div>
