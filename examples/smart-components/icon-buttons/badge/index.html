<div class="query-container">
  <div class="grid grid-col-2 cq-md:grid-col-4 gap-4">
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button-icon icon="notifications" appearance="tonal" badge-count="3" aria-label="Уведомления"></sf-button-icon></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">badge-count</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button-icon icon="mail" appearance="tonal" badge-count="120" aria-label="Сообщения"></sf-button-icon></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">больше порога</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button-icon icon="update" appearance="outline" scheme="on-surface" badge-dot aria-label="Обновления"></sf-button-icon></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">badge-dot</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button-icon icon="assignment" appearance="tonal" badge-count="12" badge-cap="9" badge-label="{count} заявка|{count} заявки|{count} заявок" aria-label="Заявки"></sf-button-icon></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">badge-label</span>
    </div>
  </div>
</div>
