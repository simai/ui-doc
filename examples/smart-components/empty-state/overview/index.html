<div class="grid grid-col-1 md:grid-col-2 gap-3">
  <div class="p-2 radius-2 border border-outline-variant"><sf-empty-state kind="no-data" size="1/2" heading-level="4"></sf-empty-state></div>
  <div class="p-2 radius-2 border border-outline-variant"><sf-empty-state kind="nothing-found" size="1/2" heading-level="4"></sf-empty-state></div>
  <div class="p-2 radius-2 border border-outline-variant"><sf-empty-state kind="no-access" size="1/2" heading-level="4"></sf-empty-state></div>
  <div class="p-2 radius-2 border border-outline-variant flex flex-col gap-2">
    <sf-empty-state id="empty-state-error" kind="error" size="1/2" heading-level="4"></sf-empty-state>
    <output class="text-1/2 color-on-surface-variant" id="empty-state-log" aria-live="polite"></output>
  </div>
</div>
