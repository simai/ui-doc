<div class="flex flex-col gap-3">
  <sf-progress-scale id="progress-scale-steps" label="Заполнение профиля" value="20"></sf-progress-scale>
  <div class="flex flex-wrap gap-2 items-cross-center">
    <sf-button id="progress-scale-steps-next" text="Шаг выполнен"></sf-button>
    <sf-button id="progress-scale-steps-reset" text="Сбросить" appearance="ghost" scheme="on-surface"></sf-button>
    <span id="progress-scale-steps-state" role="status">Выполнено шагов: 1 из 5</span>
  </div>
</div>
