<div class="query-container">
  <div class="grid grid-col-2 cq-sm:grid-col-3 cq-md:grid-col-5 gap-4">
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button scheme="primary" text="Сохранить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">primary</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button scheme="secondary" appearance="tonal" icon-start="filter_list" text="Фильтры"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">secondary</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button scheme="on-surface" appearance="outline" text="Отмена"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">on-surface</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button scheme="on-surface-variant" appearance="outline" icon-start="search" text="Найти"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">on-surface-variant</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button status="danger" icon-start="delete" text="Удалить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">danger</span>
    </div>
  </div>
</div>
