<div class="query-container">
  <div class="grid grid-col-2 cq-md:grid-col-4 gap-4">
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button icon-start="add" text="Добавить"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">в начале</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button appearance="outline" icon-end="arrow_forward" text="Далее"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">в конце</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button appearance="tonal" icon-start="download" icon-end="expand_more" text="Скачать"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">с двух сторон</span>
    </div>
    <div class="flex flex-col items-cross-center gap-2">
      <div class="flex flex-1 items-cross-center"><sf-button appearance="outline" scheme="on-surface" icon="settings" icon-position="end" text="Настройки"></sf-button></div>
      <span class="text-1/2 color-on-surface-variant wrap-none">icon в конце</span>
    </div>
  </div>
</div>
