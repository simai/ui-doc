<div class="flex flex-wrap gap-3 items-end">
  <div class="flex flex-col gap-1 items-start">
    <sf-button icon-start="add" text="Добавить"></sf-button>
    <code class="text-1/2 color-on-surface-variant">icon-start="add"</code>
  </div>
  <div class="flex flex-col gap-1 items-start">
    <sf-button appearance="outline" icon-end="arrow_forward" text="Далее"></sf-button>
    <code class="text-1/2 color-on-surface-variant">icon-end="arrow_forward"</code>
  </div>
  <div class="flex flex-col gap-1 items-start">
    <sf-button appearance="tonal" icon-start="download" icon-end="expand_more" text="Скачать"></sf-button>
    <code class="text-1/2 color-on-surface-variant">icon-start + icon-end</code>
  </div>
  <div class="flex flex-col gap-1 items-start">
    <sf-button appearance="outline" scheme="on-surface" icon="settings" icon-position="end" text="Настройки"></sf-button>
    <code class="text-1/2 color-on-surface-variant">icon + icon-position="end"</code>
  </div>
</div>
