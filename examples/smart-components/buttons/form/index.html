<form id="buttons-form" action="/profile" method="post" class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2 items-cross-center">
    <sf-button native-type="submit" name="intent" value="save" text="Сохранить"></sf-button>
    <sf-button native-type="submit" name="intent" value="draft" appearance="tonal" text="В черновик"></sf-button>
    <sf-button native-type="reset" appearance="outline" scheme="on-surface" text="Сбросить"></sf-button>
    <sf-button id="buttons-form-export" appearance="link" icon-start="download" text="Экспортировать"></sf-button>
  </div>
</form>
