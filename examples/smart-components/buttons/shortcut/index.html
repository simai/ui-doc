<div class="flex flex-col gap-3">
  <div class="flex flex-wrap gap-2 items-cross-center">
    <sf-button text="Сохранить" shortcut="mod+s"></sf-button>
    <sf-button appearance="outline" scheme="on-surface" text="Новая вкладка" shortcut="shift+mod+p"></sf-button>
    <sf-button appearance="link" scheme="on-surface" text="Закрыть" shortcut="escape"></sf-button>
  </div>
  <div class="w-full max-w-f8">
    <sf-button text="Поиск" icon-start="search" shortcut="alt+k" shortcut-listen appearance="tonal" scheme="on-surface-variant" radius="rounded" text-position="start" root-class="w-full"></sf-button>
  </div>
  <p id="buttons-shortcut-status" class="m-0 text-1/2 color-on-surface-variant" role="status">Нажмите Alt+K (⌥ K на Mac) — кнопка поиска нажмётся сама.</p>
</div>
