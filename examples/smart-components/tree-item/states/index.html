<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-4 items-cross-start">
    <div class="flex flex-col gap-2 min-w-0">
      <sf-tree aria-label="Раскрытая и свёрнутая ветви">
          <sf-tree-item label="Документы" open open-label="Развернуть" close-label="Свернуть">
            <sf-tree-item label="Договоры"></sf-tree-item>
          </sf-tree-item>
          <sf-tree-item label="Изображения" open-label="Развернуть" close-label="Свернуть">
            <sf-tree-item label="Обложки"></sf-tree-item>
          </sf-tree-item>
        </sf-tree>
      <span class="text-1/2 color-on-surface-variant">open</span>
    </div>
    <div class="flex flex-col gap-2 min-w-0">
      <sf-tree aria-label="Папка назначения" selection="one">
          <sf-tree-item label="Входящие" value="inbox"></sf-tree-item>
          <sf-tree-item label="Отчёты" value="reports" selected></sf-tree-item>
          <sf-tree-item label="Архив" value="archive"></sf-tree-item>
        </sf-tree>
      <span class="text-1/2 color-on-surface-variant">selected (у дерева selection="one")</span>
    </div>
    <div class="flex flex-col gap-2 min-w-0">
      <sf-tree aria-label="Разделы с текущей страницей">
          <sf-tree-item label="Руководство" icon="false" open open-label="Развернуть" close-label="Свернуть">
            <sf-tree-item label="Установка" icon="false" href="#tree-item-active-install"></sf-tree-item>
            <sf-tree-item label="Темы оформления" icon="false" href="#tree-item-active-themes" active></sf-tree-item>
          </sf-tree-item>
        </sf-tree>
      <span class="text-1/2 color-on-surface-variant">active</span>
    </div>
    <div class="flex flex-col gap-2 min-w-0">
      <sf-tree aria-label="Папки с недоступной">
          <sf-tree-item label="Проекты" open-label="Развернуть" close-label="Свернуть">
            <sf-tree-item label="Сайт"></sf-tree-item>
          </sf-tree-item>
          <sf-tree-item label="Черновики" disabled open-label="Развернуть" close-label="Свернуть">
            <sf-tree-item label="Новый раздел"></sf-tree-item>
          </sf-tree-item>
        </sf-tree>
      <span class="text-1/2 color-on-surface-variant">disabled</span>
    </div>
  </div>
</div>
