<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2">
    <sf-button data-redraw size="1/2" appearance="outline" scheme="on-surface" icon-start="refresh" text="Нарисовать заново"></sf-button>
  </div>
  <template id="settings-remember-template">
    <sf-settings remember="docs-example" look="rows" label="Вид таблицы">
      <script type="application/json" data-sf-settings>
        {"items": [
          {"type": "group", "text": "Вид таблицы", "items": [
            {"id": "density", "type": "choice", "text": "Плотность", "value": "normal", "options": [{"id": "compact", "text": "Плотно"}, {"id": "normal", "text": "Обычно"}]},
            {"id": "align", "type": "choice", "text": "Выравнивание", "value": "start", "options": [{"id": "start", "text": "По левому краю", "icon": "format_align_left"}, {"id": "center", "text": "По центру", "icon": "format_align_center"}, {"id": "end", "text": "По правому краю", "icon": "format_align_right"}]},
            {"id": "wrap", "type": "switch", "text": "Переносить строки", "value": false},
            {"id": "stripes", "type": "switch", "text": "Полосы через строку", "value": true}
          ]},
          {"type": "separator"},
          {"id": "scale", "type": "range", "text": "Масштаб", "value": 100, "min": 80, "max": 140, "step": 10, "unit": "%"}
        ]}
      </script>
    </sf-settings>
  </template>
  <div id="settings-remember-place" class="flex flex-col items-cross-center gap-2"></div>
  <div data-example-event-log class="p-2 radius-2 border border-outline-variant"></div>
</div>
