<div id="settings-theme-page" class="flex flex-col gap-3 p-3 radius-surface border border-outline-variant bg-surface" data-sf-theme-palette>
  <div class="flex items-cross-center gap-2">
    <span class="text-1 flex-grow">Северный порт</span>
    <sf-settings id="settings-theme-menu" look="drill" label="Настройки">
      <sf-button-icon icon="tune" appearance="outline" scheme="on-surface" size="1/2" aria-label="Настройки"></sf-button-icon>
      <script type="application/json" data-sf-settings>
        {"items": [
          {"id": "theme", "type": "choice", "text": "Тема", "icon": "contrast", "value": "system", "options": [{"id": "system", "text": "Как в системе", "icon": "computer"}, {"id": "light", "text": "Светлая", "icon": "light_mode"}, {"id": "dark", "text": "Тёмная", "icon": "dark_mode"}]},
          {"id": "color", "type": "color", "text": "Цвет оформления", "value": "blue"}
        ]}
      </script>
    </sf-settings>
  </div>
  <div class="flex flex-col gap-2">
    <h3 class="text-2 m-0">Как оформить пропуск в порт</h3>
    <p class="m-0">Заявку подают за сутки. Пропуск приходит в личный кабинет и действует до конца смены.</p>
    <div class="flex flex-wrap gap-1/3">
      <sf-button text="Подать заявку"></sf-button>
      <sf-button appearance="tonal" text="Шаблон"></sf-button>
    </div>
    <p class="m-0 text-1/2 color-on-surface-variant" id="settings-theme-state" role="status"></p>
  </div>
</div>
