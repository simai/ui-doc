<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2">
    <sf-button data-call="setValue" size="1/2" appearance="outline" scheme="on-surface" text="setValue(&quot;theme&quot;, &quot;dark&quot;)"></sf-button>
    <sf-button data-call="setAll" size="1/2" appearance="outline" scheme="on-surface" text="setAll({font: &quot;l&quot;, sound: false})"></sf-button>
    <sf-button data-call="show" size="1/2" appearance="outline" scheme="on-surface" text="show(&quot;lang&quot;)"></sf-button>
    <sf-button data-call="reset" size="1/2" appearance="outline" scheme="on-surface" text="reset()"></sf-button>
    <sf-button data-call="missing" size="1/2" appearance="outline" scheme="on-surface" text="setValue(&quot;zoom&quot;, 2)"></sf-button>
  </div>
  <div class="flex items-cross-center gap-2">
    <sf-settings id="settings-api" look="drill" label="Настройки чтения">
      <sf-button-icon icon="tune" appearance="outline" scheme="on-surface" size="1/2" aria-label="Настройки чтения"></sf-button-icon>
      <script type="application/json" data-sf-settings>
        {"items": [
          {"id": "theme", "type": "choice", "text": "Тема", "icon": "contrast", "value": "system", "options": [{"id": "system", "text": "Как в системе", "icon": "computer"}, {"id": "light", "text": "Светлая", "icon": "light_mode"}, {"id": "dark", "text": "Тёмная", "icon": "dark_mode"}]},
          {"id": "lang", "type": "choice", "text": "Язык", "icon": "translate", "value": "ru", "options": [{"id": "ru", "text": "Русский"}, {"id": "en", "text": "English"}, {"id": "kk", "text": "Қазақша"}, {"id": "de", "text": "Deutsch"}]},
          {"id": "font", "type": "choice", "text": "Размер текста", "icon": "format_size", "value": "m", "options": [{"id": "s", "text": "Мелкий"}, {"id": "m", "text": "Обычный"}, {"id": "l", "text": "Крупный"}]},
          {"id": "sound", "type": "switch", "text": "Звук", "icon": "volume_up", "value": true}
        ]}
      </script>
    </sf-settings>
    <span class="text-1/2 color-on-surface-variant">values: <span id="settings-api-values" class="mono"></span></span>
  </div>
  <div data-example-event-log class="p-2 radius-2 border border-outline-variant"></div>
</div>
