<div class="flex flex-col gap-2 items-cross-start">
  <div class="flex flex-wrap items-cross-center gap-1/3">
    <sf-settings id="settings-panel-filter" look="panel" apply="button" label="Фильтр">
      <sf-button appearance="outline" scheme="on-surface" icon-start="filter_list" text="Фильтр"></sf-button>
    </sf-settings>
    <sf-settings id="settings-panel-columns" look="panel" search label="Колонки">
      <sf-button-icon icon="view_column" appearance="outline" scheme="on-surface" aria-label="Колонки"></sf-button-icon>
    </sf-settings>
  </div>
  <p id="settings-panel-status" class="m-0 text-1/2 color-on-surface-variant" role="status">Откройте фильтр или колонки.</p>
</div>
