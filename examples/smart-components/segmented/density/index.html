<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-4">
    <div class="flex flex-col gap-2">
      <div class="flex flex-wrap items-cross-center gap-1/3">
        <sf-segmented aria-label="Вид списка, обычная плотность" value="table" items="table::Таблица|list::Список"></sf-segmented>
        <sf-button icon-start="add" text="Добавить"></sf-button>
      </div>
      <span class="text-1/2 color-on-surface-variant">обычная</span>
    </div>
    <div class="flex flex-col gap-2" data-sf-density="compact">
      <div class="flex flex-wrap items-cross-center gap-1/3">
        <sf-segmented aria-label="Вид списка, компактная плотность" value="table" items="table::Таблица|list::Список"></sf-segmented>
        <sf-button icon-start="add" text="Добавить"></sf-button>
      </div>
      <span class="text-1/2 color-on-surface-variant">компактная</span>
    </div>
  </div>
</div>
