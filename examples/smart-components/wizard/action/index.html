<sf-wizard id="wizard-import" heading="Импорт контактов">
  <sf-wizard-step name="file" label="Файл" type="info">
    <p class="m-0">Файл contacts.csv: 124 строки, разделитель — точка с запятой.</p>
  </sf-wizard-step>
  <sf-wizard-step name="run" label="Импорт" type="action" action-text="Импортировать"
    description="Контакты добавятся в адресную книгу. Если не получится, импорт можно повторить.">
  </sf-wizard-step>
  <sf-wizard-step name="done" label="Готово" type="result">
    <p class="m-0">Контакты добавлены в адресную книгу.</p>
  </sf-wizard-step>
</sf-wizard>
