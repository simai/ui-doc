<div class="flex flex-col gap-3">
  <figure class="m-0 flex flex-col gap-2">
    <figcaption class="text-1 weight-6">Обращения по месяцам</figcaption>
    <div class="flex gap-2" aria-hidden="true">
      <div class="flex flex-col items-stretch gap-1/4 flex-1 min-w-0">
        <div class="flex items-end gap-1/4" style="block-size:132px"><span class="flex-1 radius-top-1/3" data-series="orders" style="block-size:84px;background:#3375d9"></span><span class="flex-1 radius-top-1/3" data-series="returns" style="block-size:16px;background:#c25713"></span><span class="flex-1 radius-top-1/3" data-series="reviews" style="block-size:40px;background:#198a27"></span></div>
        <span class="text-1/2 color-on-surface-variant text-center">Июль</span>
      </div>
      <div class="flex flex-col items-stretch gap-1/4 flex-1 min-w-0">
        <div class="flex items-end gap-1/4" style="block-size:132px"><span class="flex-1 radius-top-1/3" data-series="orders" style="block-size:110px;background:#3375d9"></span><span class="flex-1 radius-top-1/3" data-series="returns" style="block-size:22px;background:#c25713"></span><span class="flex-1 radius-top-1/3" data-series="reviews" style="block-size:52px;background:#198a27"></span></div>
        <span class="text-1/2 color-on-surface-variant text-center">Август</span>
      </div>
      <div class="flex flex-col items-stretch gap-1/4 flex-1 min-w-0">
        <div class="flex items-end gap-1/4" style="block-size:132px"><span class="flex-1 radius-top-1/3" data-series="orders" style="block-size:122px;background:#3375d9"></span><span class="flex-1 radius-top-1/3" data-series="returns" style="block-size:18px;background:#c25713"></span><span class="flex-1 radius-top-1/3" data-series="reviews" style="block-size:62px;background:#198a27"></span></div>
        <span class="text-1/2 color-on-surface-variant text-center">Сентябрь</span>
      </div>
      <div class="flex flex-col items-stretch gap-1/4 flex-1 min-w-0">
        <div class="flex items-end gap-1/4" style="block-size:132px"><span class="flex-1 radius-top-1/3" data-series="orders" style="block-size:116px;background:#3375d9"></span><span class="flex-1 radius-top-1/3" data-series="returns" style="block-size:14px;background:#c25713"></span><span class="flex-1 radius-top-1/3" data-series="reviews" style="block-size:70px;background:#198a27"></span></div>
        <span class="text-1/2 color-on-surface-variant text-center">Октябрь</span>
      </div>
    </div>
  </figure>
  <div class="flex flex-wrap gap-3">
    <sf-input-color data-series-control="orders" size="1/2" label="Заказы" value="#3375d9" swatches="#3375d9|Синий, #198a27|Зелёный, #8c5fd2|Фиолетовый, #c25713|Оранжевый, #0080ad|Голубой"></sf-input-color>
    <sf-input-color data-series-control="returns" size="1/2" label="Возвраты" value="#c25713" swatches="#3375d9|Синий, #198a27|Зелёный, #8c5fd2|Фиолетовый, #c25713|Оранжевый, #0080ad|Голубой"></sf-input-color>
    <sf-input-color data-series-control="reviews" size="1/2" label="Отзывы" value="#198a27" swatches="#3375d9|Синий, #198a27|Зелёный, #8c5fd2|Фиолетовый, #c25713|Оранжевый, #0080ad|Голубой"></sf-input-color>
  </div>
</div>
