<div class="flex flex-col gap-3">
  <sf-input-color
    id="brand-colour"
    name="brand"
    label="Основной цвет"
    value="#005bbe"
    swatches="#005bbe|Синий, #006e17|Зелёный, #7345b7|Фиолетовый, #9f4200|Оранжевый"
    clearable>
  </sf-input-color>

  <sf-input-color
    id="accent-colour"
    name="accent"
    label="Акцент"
    inherited-value="#005bbe"
    clearable>
  </sf-input-color>

  <p id="colour-status" class="m-0 color-on-surface-variant" aria-live="polite">Измените цвет — здесь появится значение из события.</p>
</div>
