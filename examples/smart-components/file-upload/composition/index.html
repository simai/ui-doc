<div class="grid grid-col-1 gap-3">
  <div class="flex flex-col gap-1">
    <sf-file-upload aria-label="Выбрать файл"></sf-file-upload>
    <code class="text-1/2 color-on-surface-variant">без текстов: приглашение на языке страницы</code>
  </div>
  <div class="flex flex-col gap-1">
    <sf-file-upload link-text="Выберите договор" text="или перетащите его сюда" accept=".pdf" aria-label="Выбрать договор"></sf-file-upload>
    <code class="text-1/2 color-on-surface-variant">link-text text accept=".pdf"</code>
  </div>
  <div class="flex flex-col gap-1">
    <sf-file-upload link-text="Выберите фото" text="" icon="image" supporting-text="JPG или PNG, до 10 МБ" aria-label="Выбрать фото"></sf-file-upload>
    <code class="text-1/2 color-on-surface-variant">icon supporting-text</code>
  </div>
</div>
