<div class="grid grid-col-1 md:grid-col-2 gap-3 items-cross-start">
  <sf-input
    name="email"
    label="Рабочая почта"
    input-type="email"
    autocomplete="email"
    value="ivanov@"
    required
    invalid
    error-message="Введите адрес целиком, например ivanov@example.com">
  </sf-input>

  <sf-input
    name="login"
    label="Логин"
    appearance="filled"
    value="ivanov"
    hint="Логин меняет администратор"
    disabled>
  </sf-input>
</div>
