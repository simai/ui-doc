<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-2 gap-4">
    <div class="flex flex-col gap-2">
      <sf-input input-type="email" autocomplete="email" label="Почта" placeholder="name@example.com" hint="Пришлём на неё чек"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">email</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input input-type="password" autocomplete="current-password" label="Пароль" minlength="8" hint="Не короче 8 символов"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">password</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input input-type="tel" inputmode="tel" autocomplete="tel" label="Телефон" placeholder="+7 900 000-00-00" hint="Для связи с курьером"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">tel</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input input-type="url" inputmode="url" label="Сайт" placeholder="https://example.com" hint="Адрес целиком, с https://"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">url</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input input-type="search" icon-start="search" label="Поиск" placeholder="Название документа" hint="По названию и автору"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">search</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input input-type="number" inputmode="decimal" label="Вес посылки" text-end="кг" min="0.1" max="30" step="0.1" value="2.5" hint="От 0,1 до 30 кг"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">number</span>
    </div>
  </div>
</div>
