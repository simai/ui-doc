<div class="grid grid-col-1 md:grid-col-2 gap-3 items-cross-start">
  <div class="flex flex-col gap-1">
    <sf-input input-type="email" autocomplete="email" label="Почта" placeholder="name@example.com"></sf-input>
    <code class="text-1/2 color-on-surface-variant">input-type="email"</code>
  </div>
  <div class="flex flex-col gap-1">
    <sf-input input-type="password" autocomplete="current-password" label="Пароль" minlength="8"></sf-input>
    <code class="text-1/2 color-on-surface-variant">input-type="password"</code>
  </div>
  <div class="flex flex-col gap-1">
    <sf-input input-type="tel" inputmode="tel" autocomplete="tel" label="Телефон" placeholder="+7 900 000-00-00"></sf-input>
    <code class="text-1/2 color-on-surface-variant">input-type="tel"</code>
  </div>
  <div class="flex flex-col gap-1">
    <sf-input input-type="url" inputmode="url" label="Сайт" placeholder="https://example.com"></sf-input>
    <code class="text-1/2 color-on-surface-variant">input-type="url"</code>
  </div>
</div>
