<div class="query-container">
  <div class="grid grid-col-1 cq-md:grid-col-3 gap-4">
    <div class="flex flex-col gap-2">
      <sf-input label="Поиск" icon-start="search" placeholder="Название документа" hint="По названию и автору"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">icon-start</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input label="Стоимость" value="1500" text-end="₽" hint="Цена за месяц"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">text-end</span>
    </div>
    <div class="flex flex-col gap-2">
      <sf-input label="Промокод" hint="Код из письма" hint-icon="info"></sf-input>
      <span class="text-1/2 color-on-surface-variant wrap-none self-center">hint-icon</span>
    </div>
  </div>
</div>
