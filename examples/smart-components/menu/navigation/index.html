<div class="flex flex-col gap-4">
  <sf-header-site collapse="md">
    <a slot="brand" href="#home"><span class="font-medium">Технопром</span></a>
    <sf-menu label="Разделы сайта: отметка линией" orientation="horizontal" appearance="navigation" overflow="more" collapse="none" indicator="line" current="pumps" items='[
      {"id": "catalog", "label": "Каталог", "href": "#catalog", "children": [
        {"id": "pumps", "label": "Насосное оборудование", "href": "#pumps"},
        {"id": "valves", "label": "Трубопроводная арматура", "href": "#valves"}
      ]},
      {"id": "services", "label": "Услуги", "href": "#services"},
      {"id": "projects", "label": "Проекты", "href": "#projects"},
      {"id": "contacts", "label": "Контакты", "href": "#contacts"}
    ]'></sf-menu>
  </sf-header-site>
  <sf-header-site collapse="md" style="--sf-site-header-border-color: var(--sf-transparent)">
    <a slot="brand" href="#home"><span class="font-medium">Технопром</span></a>
    <sf-menu label="Разделы сайта: отметка заливкой" orientation="horizontal" appearance="navigation" overflow="more" collapse="none" indicator="fill" current="pumps" items='[
      {"id": "catalog", "label": "Каталог", "href": "#catalog", "children": [
        {"id": "pumps", "label": "Насосное оборудование", "href": "#pumps"},
        {"id": "valves", "label": "Трубопроводная арматура", "href": "#valves"}
      ]},
      {"id": "services", "label": "Услуги", "href": "#services"},
      {"id": "projects", "label": "Проекты", "href": "#projects"},
      {"id": "contacts", "label": "Контакты", "href": "#contacts"}
    ]'></sf-menu>
  </sf-header-site>
</div>
<script>
(() => {
  // The example behaves like a site: a press moves the current page.
  const root = document.currentScript.previousElementSibling;
  const menus = root.matches('sf-menu') ? [root] : root.querySelectorAll('sf-menu');
  menus.forEach((menu) => menu.addEventListener('sf-menu-navigate', (event) => {
    event.preventDefault();
    menu.setAttribute('current', event.detail.id);
  }));
})();
</script>
