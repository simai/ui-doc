<div class="grid grid-col-1 md:grid-col-2 gap-4 items-cross-start">
  <div class="flex flex-col gap-2">
    <sf-menu label="Разделы сервера" appearance="navigation" collapse="none" items='[
      {"id": "health", "label": "Состояние", "href": "#health", "icon": "monitor_heart", "status": "success"},
      {"id": "address", "label": "Адрес", "href": "#address", "icon": "language", "status": "warning"},
      {"id": "backup", "label": "Резервные копии", "href": "#backup", "icon": "backup", "status": "error"},
      {"id": "updates", "label": "Обновления", "href": "#updates", "icon": "update", "status": "info"},
      {"id": "archive", "label": "Архив", "href": "#archive", "icon": "inventory_2", "status": "neutral"}
    ]'></sf-menu>
    <span class="text-1/2 color-on-surface-variant">status: success, warning, error, info, neutral</span>
  </div>
  <div class="flex flex-col gap-2">
    <sf-menu label="Разделы сайта со счётчиками" appearance="navigation" collapse="none" items='[
      {"id": "journal", "label": "Журнал", "href": "#journal", "icon": "history", "status": "warning", "count": 3},
      {"id": "data", "label": "Данные", "href": "#data", "icon": "database", "count": 12},
      {"id": "mail", "label": "Почта", "href": "#mail", "icon": "mail", "count": 120}
    ]'></sf-menu>
    <span class="text-1/2 color-on-surface-variant">count, с точкой и без</span>
  </div>
</div>
<script>
(() => {
  // The example behaves like a site: a press moves the current page.
  const root = document.currentScript.previousElementSibling;
  const menus = root.matches('sf-menu') ? [root] : root.querySelectorAll('sf-menu');
  menus.forEach((menu) => menu.addEventListener('sf-menu-navigate', (event) => {
    event.preventDefault();
    menu.setAttribute('current', event.detail.id);
  }));
})();
</script>
