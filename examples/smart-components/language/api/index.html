<div class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2 items-cross-center">
    <sf-language id="language-api" languages="ru en de fr es" apply="none" size="1/2"></sf-language>
    <sf-button data-language="en" size="1/2" appearance="outline" scheme="on-surface" text="select en"></sf-button>
    <sf-button data-language="ru" size="1/2" appearance="outline" scheme="on-surface" text="select ru"></sf-button>
    <sf-button data-language="xx" size="1/2" appearance="outline" scheme="on-surface" text="select xx"></sf-button>
    <sf-button data-toggle size="1/2" appearance="outline" scheme="on-surface" text="toggleMenu()"></sf-button>
  </div>
</div>
