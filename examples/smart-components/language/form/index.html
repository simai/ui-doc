<form id="language-form" class="flex flex-col gap-4">
  <div class="flex flex-wrap gap-2 items-cross-center">
    <sf-language name="language" languages="ru en de fr" value="de" apply="none" size="1/2"></sf-language>
    <sf-button native-type="submit" size="1/2" text="Сохранить"></sf-button>
    <sf-button native-type="reset" size="1/2" appearance="outline" scheme="on-surface" text="Сбросить"></sf-button>
  </div>
  <div data-example-event-log class="p-2 radius-2 border border-outline-variant"></div>
</form>
