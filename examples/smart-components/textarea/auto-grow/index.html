<div class="grid grid-col-1 md:grid-col-2 gap-3 items-cross-start">
  <sf-textarea
    name="comment"
    label="Комментарий"
    placeholder="Напишите комментарий"
    auto-grow
    min-rows="1"
    max-rows="6">
  </sf-textarea>

  <sf-textarea
    name="summary"
    label="Краткое описание"
    appearance="filled"
    value="Первая строка описания.&#10;Вторая строка.&#10;Третья строка.&#10;Четвёртая строка.&#10;Пятая строка уже прокручивается внутри поля."
    auto-grow
    min-rows="2"
    max-rows="4">
  </sf-textarea>
</div>
