<fieldset id="export-columns" class="border-0 p-0 m-0">
  <legend class="m-bottom-2 weight-medium">Столбцы для выгрузки</legend>
  <div class="flex flex-col gap-2">
    <sf-checkbox label="Все столбцы" controls="export-col-title export-col-author export-col-updated"></sf-checkbox>
    <div class="flex flex-col gap-2 p-inline-start-4">
      <sf-checkbox id="export-col-title" name="columns[]" value="title" label="Название" checked></sf-checkbox>
      <sf-checkbox id="export-col-author" name="columns[]" value="author" label="Автор"></sf-checkbox>
      <sf-checkbox id="export-col-updated" name="columns[]" value="updated" label="Дата изменения"></sf-checkbox>
    </div>
  </div>
</fieldset>
