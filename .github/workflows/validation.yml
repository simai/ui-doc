name: Validate UI documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 peeled commit
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.5"
          cache: yarn

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate clean lifecycle and production documentation
        env:
          PHP_BINARY: php
        run: bin/validate-docs-project.sh

      - name: Repeat validation from a clean checkout
        env:
          PHP_BINARY: php
        run: bin/test-project-lifecycle.sh
