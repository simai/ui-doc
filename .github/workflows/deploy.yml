name: Deploy UI Development

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 peeled commit
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.5"
          cache: yarn

      - name: Prepare .env
        run: |
          cat <<'EOF' > .env
          DOCS_DIR=docs
          AZURE_KEY=''
          AZURE_REGION=''
          AZURE_ENDPOINT=https://api.cognitive.microsofttranslator.com
          EOF

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate clean lifecycle and build production documentation
        env:
          PHP_BINARY: php
        run: bin/validate-docs-project.sh

      - name: Deploy via SSH
        uses: appleboy/ssh-action@b60142998894e495c513803efc6d5d72a72c968a # v0.1.8
        with:
          host: ${{ vars.SSH_SERVER }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            cd /var/www/dev/data/git/ui-doc
            export HOME=/home/git
            mkdir -p ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts
            git config --global --add safe.directory /var/www/dev/data/git/ui-doc
            git reset --hard
            git clean -fd
            git pull --ff-only origin main
            export XDG_CONFIG_HOME=$PWD/.config
            export XDG_CACHE_HOME=$PWD/.cache
            mkdir -p "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
            cat <<'EOF' > .env
            DOCS_DIR=docs
            AZURE_KEY=''
            AZURE_REGION=''
            AZURE_ENDPOINT=https://api.cognitive.microsofttranslator.com
            EOF
            composer install --no-dev --prefer-dist --no-interaction
            PHP_BINARY=php bin/validate-docs-project.sh
            rsync -av --delete /var/www/dev/data/git/ui-doc/build_production/ /var/www/dev/data/www/ui.simai.io/
